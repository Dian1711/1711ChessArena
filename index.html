<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>1711 Chess Arena</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #172b4d 0%, #080d16 48%, #03060b 100%);
      color: white;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       MAIN
    ========================= */

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 14px 12px 28px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(145deg, #25a7ff, #1552a5);
      box-shadow:
        0 0 18px rgba(35, 143, 255, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
      font-size: 25px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    .brand-sub {
      font-size: 10px;
      color: #82a4c9;
      margin-top: 2px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 20px;
      background: rgba(20, 34, 53, 0.8);
      border: 1px solid rgba(75, 147, 217, 0.3);
      font-size: 11px;
      color: #8fb3d9;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #37e78b;
      box-shadow: 0 0 10px #37e78b;
    }

    /* =========================
       PLAYER
    ========================= */

    .player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 16px;
      background:
        linear-gradient(
          145deg,
          rgba(25, 40, 61, 0.96),
          rgba(8, 14, 24, 0.96)
        );
      border: 1px solid rgba(91, 142, 190, 0.25);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(145deg, #263f5d, #101b2b);
      border: 2px solid #2e79b9;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.12),
        0 5px 12px rgba(0, 0, 0, 0.3);
      font-size: 24px;
    }

    .avatar.enemy {
      border-color: #b44565;
      background:
        linear-gradient(145deg, #54233a, #17101b);
    }

    .player-name {
      font-weight: 800;
      font-size: 14px;
    }

    .player-rating {
      margin-top: 4px;
      font-size: 11px;
      color: #7d9cbb;
    }

    .timer {
      min-width: 75px;
      padding: 8px 10px;
      border-radius: 11px;
      text-align: center;
      font-size: 19px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      background: #07101b;
      border: 1px solid #25445f;
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.6),
        0 2px 7px rgba(0, 0, 0, 0.25);
    }

    .timer.active {
      border-color: #31a5ff;
      box-shadow:
        0 0 12px rgba(40, 160, 255, 0.28),
        inset 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    /* =========================
       BOARD AREA
    ========================= */

    .board-area {
      margin-top: 12px;
      padding: 8px;
      border-radius: 19px;
      background:
        linear-gradient(145deg, #1c2e43, #07101a);
      border: 1px solid rgba(79, 141, 193, 0.35);
      box-shadow:
        0 16px 35px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /*
      PENTING:
      Grid selalu 8 kolom x 8 baris.
      Aspect ratio 1:1 membuat seluruh kotak sama ukuran.
    */

    .board {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      overflow: hidden;
      border-radius: 11px;
      background: #0d1722;
      border: 2px solid #287fc1;
      box-shadow:
        0 0 0 2px rgba(20, 104, 170, 0.18),
        0 12px 22px rgba(0, 0, 0, 0.35);
    }

    .square {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #2774aa;
      cursor: pointer;
      user-select: none;
    }

    .square.light {
      background:
        linear-gradient(
          145deg,
          #d7e5ee 0%,
          #b9d0de 50%,
          #a4c1d2 100%
        );
    }

    .square.dark {
      background:
        linear-gradient(
          145deg,
          #315f7d 0%,
          #23475f 50%,
          #19374d 100%
        );
    }

    .square:hover {
      filter: brightness(1.12);
    }

    .square.selected {
      box-shadow:
        inset 0 0 0 3px #ffd84d,
        inset 0 0 20px rgba(255, 215, 60, 0.35);
    }

    .square.possible::after {
      content: "";
      position: absolute;
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: rgba(41, 238, 151, 0.85);
      box-shadow:
        0 0 12px rgba(41, 238, 151, 0.7);
      z-index: 1;
    }

    .square.capture::after {
      content: "";
      position: absolute;
      width: 74%;
      height: 74%;
      border-radius: 50%;
      border: 4px solid rgba(255, 82, 107, 0.9);
      box-shadow:
        0 0 13px rgba(255, 70, 95, 0.55);
      z-index: 1;
    }

    /* =========================
       COORDINATES
    ========================= */

    .coord-file,
    .coord-rank {
      position: absolute;
      font-size: 8px;
      font-weight: 900;
      pointer-events: none;
      opacity: 0.72;
      z-index: 4;
    }

    .coord-file {
      right: 3px;
      bottom: 2px;
    }

    .coord-rank {
      left: 3px;
      top: 2px;
    }

    .square.light .coord-file,
    .square.light .coord-rank {
      color: #244b68;
    }

    .square.dark .coord-file,
    .square.dark .coord-rank {
      color: #b9e4ff;
    }

    /* =========================
       CHESS PIECE
    ========================= */

    .piece {
      position: relative;
      width: 90%;
      height: 94%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      pointer-events: none;
      transform: translateY(-1%);
    }

    .piece svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .piece.white {
      filter:
        drop-shadow(2px 4px 2px rgba(0, 0, 0, 0.5));
    }

    .piece.black {
      filter:
        drop-shadow(2px 4px 2px rgba(0, 0, 0, 0.65));
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      margin-top: 10px;
      padding: 9px 12px;
      text-align: center;
      border-radius: 11px;
      background: rgba(7, 16, 27, 0.78);
      border: 1px solid rgba(61, 108, 148, 0.28);
      color: #8fb1cc;
      font-size: 12px;
    }

    .status strong {
      color: #43c1ff;
    }

    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 11px;
    }

    .btn {
      border: 0;
      border-radius: 13px;
      padding: 13px 10px;
      font-size: 13px;
      font-weight: 900;
      color: white;
      cursor: pointer;
      box-shadow:
        0 6px 15px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transition:
        transform 0.12s ease,
        filter 0.12s ease;
    }

    .btn:active {
      transform: translateY(2px) scale(0.99);
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn-blue {
      background:
        linear-gradient(145deg, #2699ef, #1558a4);
    }

    .btn-purple {
      background:
        linear-gradient(145deg, #a44dff, #5a2bb4);
    }

    /* =========================
       BOTTOM INFO
    ========================= */

    .info {
      margin-top: 13px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .info-box {
      padding: 10px 7px;
      text-align: center;
      border-radius: 12px;
      background: rgba(15, 27, 42, 0.82);
      border: 1px solid rgba(72, 119, 159, 0.22);
    }

    .info-value {
      font-size: 14px;
      font-weight: 900;
      color: #d9efff;
    }

    .info-label {
      margin-top: 3px;
      font-size: 9px;
      color: #6e8da8;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 390px) {
      .app {
        padding-left: 8px;
        padding-right: 8px;
      }

      .board-area {
        padding: 5px;
      }

      .avatar {
        width: 40px;
        height: 40px;
        font-size: 21px;
      }

      .timer {
        min-width: 67px;
        font-size: 17px;
      }

      .brand-title {
        font-size: 18px;
      }

      .piece {
        width: 94%;
        height: 96%;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       SVG DEFINITIONS
       ===================================================== -->

  <svg
    width="0"
    height="0"
    style="position:absolute; left:-9999px; overflow:hidden;"
    aria-hidden="true"
  >
    <defs>

      <!-- WHITE MATERIAL -->
      <linearGradient id="whiteMain" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="28%" stop-color="#f5fbff"/>
        <stop offset="55%" stop-color="#b9e1f5"/>
        <stop offset="78%" stop-color="#72b7da"/>
        <stop offset="100%" stop-color="#397ba3"/>
      </linearGradient>

      <!-- BLACK MATERIAL -->
      <linearGradient id="blackMain" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#657789"/>
        <stop offset="22%" stop-color="#354454"/>
        <stop offset="50%" stop-color="#1c2733"/>
        <stop offset="76%" stop-color="#0d141d"/>
        <stop offset="100%" stop-color="#05080d"/>
      </linearGradient>

      <!-- WHITE EDGE -->
      <linearGradient id="whiteEdge" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff7bd"/>

        <stop offset="100%" stop-color="#b46b08"/>

      <!-- BLACK EDGE -->
      <linearGradient id="blackEdge" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff6d91"/>

      <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">

        id="svgShadow"

          dx="2.5"
          dy="4"

    </defs>

      ["wp", "wp", "wp", "wp", "wp", "wp", "wp", "wp"],

          />

          <!-- chest -->
          <path

              M39 78
              C43 87 44 94 41 103

              C53 81 46 83 39 78

            "
            fill="${main}"
          />

          <!-- base -->
          <path
            d="M23 101 C35 108 65 108 77 101"

            stroke="${edge}"
            stroke-width="5"
          />

          <!-- highlight -->
          <path
            d="
              M38 35
              C34 45 39 56 45 64
              C48 68 48 73 46 77

    /* =====================================================
       CREATE PIECE
       ===================================================== */

    function createPiece(code) {

      if (!code) return null;

      const side = code[0];
      const type = code[1];

      const div = document.createElement("div");

      div.className =
        "piece " +
        (side === "w" ? "white" : "black");

      div.innerHTML =
        pieceSVG(type, side);

      return div;
    }


    /* =====================================================
       DRAW BOARD
       ===================================================== */

    function drawBoard() {

      const board =
        document.getElementById("board");

      board.innerHTML = "";

      const files = ["a", "b", "c", "d", "e", "f", "g", "h"];

      for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

          const square =
            document.createElement("div");

          square.className =
            "square " +
            ((row + col) % 2 === 0
              ? "light"
              : "dark");

          square.dataset.row = row;
          square.dataset.col = col;

          /* coordinates */
          if (row === 7) {

            const file =
              document.createElement("span");

            file.className = "coord-file";
            file.textContent = files[col];

            square.appendChild(file);
          }

          if (col === 0) {

            const rank =
              document.createElement("span");

            rank.className = "coord-rank";
            rank.textContent = 8 - row;

            square.appendChild(rank);
          }


          /* piece */
          const piece =
            boardState[row][col];

          if (piece) {

            const pieceElement =
              createPiece(piece);

            square.appendChild(pieceElement);
          }


          square.addEventListener(
            "click",
            () => handleSquareClick(row, col)
          );

          board.appendChild(square);
        }
      }

      updateSelection();
    }


    /* =====================================================
       CLICK SQUARE
    ===================================================== */

    function handleSquareClick(row, col) {

      const clickedPiece =
        boardState[row][col];


      /* Tidak ada selected */
      if (!selectedSquare) {

        if (
          clickedPiece &&
          clickedPiece[0] === currentTurn
        ) {

          selectedSquare = {
            row,
            col
          };

          updateSelection();

          setStatus(
            "Pilih kotak tujuan"
          );
        }

        return;
      }


      /* Klik bidak sendiri */
      if (
        clickedPiece &&
        clickedPiece[0] === currentTurn
      ) {

        selectedSquare = {
          row,
          col
        };

        updateSelection();

        return;
      }


      /* Pindahkan bidak */
      boardState[row][col] =
        boardState[
          selectedSquare.row
        ][selectedSquare.col];

      boardState[
        selectedSquare.row
      ][selectedSquare.col] = null;


      selectedSquare = null;

      currentTurn =
        currentTurn === "w"
          ? "b"
          : "w";


      drawBoard();

      setStatus(
        currentTurn === "w"
          ? "Giliran <strong>Putih</strong>"
          : "Giliran <strong>Hitam</strong>"
      );
    }


    /* =====================================================
       SELECTION
    ===================================================== */

    function updateSelection() {

      const squares =
        document.querySelectorAll(".square");

      squares.forEach(square => {

        square.classList.remove(
          "selected",
          "possible",
          "capture"
        );

        if (!selectedSquare) {
          return;
        }

        const row =
          Number(square.dataset.row);

        const col =
          Number(square.dataset.col);


        if (
          row === selectedSquare.row &&
          col === selectedSquare.col
        ) {

          square.classList.add(
            "selected"
          );

          return;
        }


        const target =
          boardState[row][col];


        /*
          Demo visual:
          tampilkan titik pada kotak kosong
          di sekitar bidak yang dipilih.
        */

        const distance =
          Math.abs(
            row - selectedSquare.row
          ) +
          Math.abs(
            col - selectedSquare.col
          );


        if (
          !target &&
          distance <= 2
        ) {

          square.classList.add(
            "possible"
          );

        } else if (
          target &&
          target[0] !== currentTurn
        ) {

          square.classList.add(
            "capture"
          );
        }

      });
    }


    /* =====================================================
       STATUS
    ===================================================== */

    function setStatus(text) {

      document.getElementById(
        "status"
      ).innerHTML = text;
    }


    /* =====================================================
       NEW GAME
    ===================================================== */

    function newGame() {

      boardState =
        JSON.parse(
          JSON.stringify(initialBoard)
        );

      selectedSquare = null;
      currentTurn = "w";

      document.getElementById(
        "myTimer"
      ).textContent = "10:00";

      document.getElementById(
        "enemyTimer"
      ).textContent = "10:00";

      drawBoard();

      setStatus(
        "Game baru dimulai — giliran <strong>Putih</strong>"
      );
    }


    /* =====================================================
       FIND OPPONENT
    ===================================================== */

    function findOpponent() {

      setStatus(
        "⚔ <strong>Mencari lawan...</strong>"
      );

      setTimeout(() => {

        setStatus(
          "Lawan belum tersedia — mode demo aktif"
        );

      }, 1800);
    }


    /* =====================================================
       TIMER DEMO
    ===================================================== */

    let mySeconds = 600;
    let enemySeconds = 600;

    setInterval(() => {

      if (currentTurn === "w") {

        if (mySeconds > 0) {
          mySeconds--;
        }

        updateTimer(
          "myTimer",
          mySeconds
        );

      } else {

        if (enemySeconds > 0) {
          enemySeconds--;
        }

        updateTimer(
          "enemyTimer",
          enemySeconds
        );
      }

    }, 1000);


    function updateTimer(id, seconds) {

      const minutes =
        Math.floor(seconds / 60);

      const secs =
        seconds % 60;

      document.getElementById(id)
        .textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0");
    }


    /* =====================================================
       START
    ===================================================== */

    drawBoard();

  </script>
