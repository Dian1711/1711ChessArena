<!DOCTYPE html>
<html lang="id">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>1711 Chess Arena</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #11151b;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    padding: 14px;
    background:
        radial-gradient(
            circle at top,
            #252d37 0%,
            #11151b 45%,
            #0b0e12 100%
        );
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .5px;
}

.logo span {
    color: #d7a96b;
}

.online {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,.07);
    font-size: 11px;
    color: #aeb8c4;
}

.online-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4bd37b;
    box-shadow: 0 0 8px rgba(75,211,123,.7);
}

/* PLAYER */

.player {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    background: rgba(255,255,255,.055);
}

.player-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 21px;
    background: linear-gradient(145deg,#3d4652,#171b21);
    border: 1px solid rgba(255,255,255,.13);
}

.player-info {
    min-width: 0;
    flex: 1;
}

.player-name {
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-rating {
    margin-top: 3px;
    font-size: 11px;
    color: #9ba5b1;
}

.timer {
    min-width: 75px;
    text-align: center;
    padding: 7px 10px;
    border-radius: 9px;
    background: #0c1015;
    border: 1px solid rgba(255,255,255,.08);
    font-size: 18px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

/* BOARD */

.board-wrap {
    width: 100%;
    padding: 7px;
    border-radius: 17px;
    background: #171c22;
    border: 1px solid rgba(255,255,255,.09);
    box-shadow:
        0 18px 45px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(255,255,255,.025);
}

.board {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    overflow: hidden;
    border-radius: 9px;
    background: #999;
}

/* SQUARE */

.square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(50,55,60,.28);
}

.square.light {
    background: #f1f1ed;
}

.square.dark {
    background: #a8adb2;
}

/* PIECES */

.piece {
    width: 88%;
    height: 88%;
    object-fit: contain;
    object-position: center;
    display: block;
    user-select: none;
    pointer-events: none;

    filter:
        drop-shadow(0 2px 1px rgba(0,0,0,.25))
        drop-shadow(0 4px 3px rgba(0,0,0,.15));
}

/*
   BIDAK PUTIH
   COKLAT MUDA
*/

.white-piece {
    filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(345deg)
        brightness(1.05)
        contrast(1.05)
        drop-shadow(0 3px 2px rgba(0,0,0,.30))
        drop-shadow(0 5px 4px rgba(0,0,0,.18));
}

/*
   BIDAK HITAM
*/

.black-piece {
    filter:
        brightness(.10)
        contrast(1.25)
        drop-shadow(0 2px 1px rgba(255,255,255,.08))
        drop-shadow(0 4px 4px rgba(0,0,0,.35));
}

/* PAWN */

.pawn {
    width: 72%;
    height: 72%;
}

/* COORDINATES */

.coord {
    position: absolute;
    font-size: 7px;
    font-weight: 700;
    opacity: .42;
    pointer-events: none;
}

.coord.rank {
    left: 3px;
    top: 2px;
}

.coord.file {
    right: 3px;
    bottom: 2px;
}

/* BUTTONS */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 12px;
}

.btn {
    border: 0;
    border-radius: 12px;
    padding: 13px 10px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

.btn-primary {
    background: linear-gradient(145deg,#c18b4d,#8f5e29);
}

.btn-secondary {
    background: #252c34;
    border: 1px solid rgba(255,255,255,.08);
}

.btn:active {
    transform: scale(.98);
}

/* STATUS */

.status {
    margin-top: 11px;
    padding: 11px 13px;
    border-radius: 12px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);
    text-align: center;
    font-size: 11px;
    color: #9da7b3;
}

.status strong {
    color: #d8a967;
}

/* MOBILE */

@media (max-width: 380px) {

    .app {
        padding: 9px;
    }

    .player {
        padding: 9px;
    }

    .player-avatar {
        width: 37px;
        height: 37px;
        font-size: 18px;
    }

    .timer {
        min-width: 66px;
        font-size: 16px;
    }
}
</style>
</head>
