<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>1711 Chess Arena</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070a11;
  color:white;
  font-family:Arial,sans-serif;
}

#app{
  width:100%;
  max-width:600px;
  height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 25%,#1d2942,#070a11 72%);
}

/* HEADER */

.header{
  height:56px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#080c15;
  border-bottom:1px solid #263149;
}

.logo{
  font-size:17px;
  font-weight:900;
}

.logo span{
  color:#38cfff;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;
  color:#62ef9a;
  font-size:10px;
  font-weight:bold;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#43ee7e;
  box-shadow:0 0 10px #43ee7e;
}

/* PLAYER */

.player{
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 14px;
}

.player.bottom{
  flex-direction:row-reverse;
}

.avatar{
  width:46px;
  height:46px;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  border-radius:13px;
  border:2px solid #53627d;
}

.avatar.red{
  background:linear-gradient(145deg,#ff536d,#761c36);
}

.avatar.blue{
  background:linear-gradient(145deg,#42c9ff,#1747a4);
}

.head{
  position:absolute;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#ffd0a6;
  top:6px;
  left:50%;
  transform:translateX(-50%);
}

.body{
  position:absolute;
  width:30px;
  height:23px;
  border-radius:15px 15px 5px 5px;
  background:#fff;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
}

.red .body{
  background:#ffdce2;
}

.blue .body{
  background:#d9f6ff;
}

.info{
  min-width:0;
}

.name{
  font-size:13px;
  font-weight:900;
}

.rating{
  margin-top:3px;
  font-size:10px;
  color:#8996ad;
}

.timer{
  margin-left:auto;
  min-width:68px;
  padding:8px 9px;
  border-radius:10px;
  background:#151d2c;
  border:1px solid #35425b;
  text-align:center;
  font-size:16px;
  font-weight:900;
}

.bottom .timer{
  margin-left:0;
  margin-right:auto;
}

/* =========================
   BOARD
========================= */

.board-wrap{
  width:min(94vw,540px);
  aspect-ratio:1/1;
  margin:auto;
  flex-shrink:1;
  min-height:0;
  padding:4px;
  border-radius:14px;
  background:#182238;
  box-shadow:
    0 0 0 2px #43516d,
    0 18px 50px rgba(0,0,0,.7);
}

.board{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  border-radius:9px;
  overflow:hidden;
}

/* KOTAK */

.square{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;

  /* GARIS BORDER SETIAP KOTAK */
  border:2px solid #237fd0;

  cursor:pointer;

  user-select:none;
}

.square.light{
  background:
    linear-gradient(
      145deg,
      #e7c987,
      #c79c55
    );
}

.square.dark{
  background:
    linear-gradient(
      145deg,
      #855535,
      #57321f
    );
}

.square.selected{
  box-shadow:
    inset 0 0 0 4px #fff200,
    inset 0 0 18px #fff200;
}

.square.target{
  box-shadow:
    inset 0 0 0 4px #52ff8a;
}

/* =========================
   3D BIDAK
========================= */

.piece{
  position:relative;
  width:78%;
  height:82%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  filter:
    drop-shadow(3px 5px 3px rgba(0,0,0,.55));
  transform:translateY(-2%);
  transition:transform .15s;
  z-index:2;
}

.square:hover .piece{
  transform:
    translateY(-6%)
    scale(1.05);
}

/* BADAN BIDAK */

.piece .base{
  width:72%;
  height:16%;
  border-radius:50%;
  position:absolute;
  bottom:2%;
  box-shadow:
    inset 3px 3px 4px rgba(255,255,255,.4),
    inset -4px -4px 5px rgba(0,0,0,.4);
}

.piece .bodypiece{
  position:absolute;
  bottom:14%;
  width:40%;
  height:42%;
  border-radius:40% 40% 30% 30%;
  box-shadow:
    inset 4px 2px 5px rgba(255,255,255,.35),
    inset -5px -5px 7px rgba(0,0,0,.35);
}

.piece .headpiece{
  position:absolute;
  bottom:52%;
  width:34%;
  aspect-ratio:1;
  border-radius:50%;
  box-shadow:
    inset 3px 2px 4px rgba(255,255,255,.35),
    inset -4px -4px 5px rgba(0,0,0,.35);
}

/* WHITE */

.white .base,
.white .bodypiece,
.white .headpiece{
  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      #55ddff 42%,
      #1684c9 100%
    );
}

/* BLACK */

.black .base,
.black .bodypiece,
.black .headpiece{
  background:
    linear-gradient(
      135deg,
      #ff7181 0%,
      #d52e52 42%,
      #57162c 100%
    );
}

/* PAWN */

.pawn .bodypiece{
  height:38%;
  width:43%;
}

.pawn .headpiece{
  bottom:48%;
  width:34%;
}

/* ROOK */

.rook .bodypiece{
  height:45%;
  width:50%;
  border-radius:15%;
}

.rook .headpiece{
  width:54%;
  height:15%;
  bottom:52%;
  border-radius:20%;
}

/* BISHOP */

.bishop .bodypiece{
  height:47%;
  width:42%;
  clip-path:polygon(
    30% 0,
    70% 0,
    100% 100%,
    0 100%
  );
}

.bishop .headpiece{
  width:34%;
  height:18%;
  bottom:54%;
  border-radius:50% 50% 20% 20%;
}

/* KNIGHT */

.knight .bodypiece{
  height:46%;
  width:48%;
  border-radius:45% 45% 20% 20%;
  transform:skewY(-5deg);
}

.knight .headpiece{
  width:42%;
  height:34%;
  bottom:50%;
  border-radius:55% 55% 35% 20%;
  transform:rotate(-10deg);
}

.knight .headpiece::after{
  content:"";
  position:absolute;
  width:0;
  height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-bottom:15px solid currentColor;
  top:-10px;
  left:35%;
}

/* QUEEN */

.queen .bodypiece{
  height:49%;
  width:43%;
}

.queen .headpiece{
  width:45%;
  height:20%;
  bottom:56%;
  border-radius:20%;
}

.queen .headpiece::before{
  content:"♛";
  position:absolute;
  color:#fff;
  font-size:15px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-shadow:1px 1px 2px #000;
}

/* KING */

.king .bodypiece{
  height:51%;
  width:45%;
}

.king .headpiece{
  width:43%;
  height:20%;
  bottom:57%;
  border-radius:20%;
}

.king .headpiece::before{
  content:"+";
  position:absolute;
  color:#fff;
  font-size:20px;
  font-weight:900;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  text-shadow:1px 1px 2px #000;
}

/* CONTROLS */

.controls{
  height:55px;
  flex-shrink:0;
  display:flex;
  justify-content:center;
  gap:9px;
  padding:7px;
}

button{
  border:0;
  border-radius:11px;
  padding:10px 16px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,#2878ff,#6848ff);
}

button.secondary{
  background:#171f2f;
  border:1px solid #37445d;
}

.status{
  height:21px;
  flex-shrink:0;
  text-align:center;
  color:#8c99ae;
  font-size:10px;
}

/* MOBILE */

  .header{
    height:49px;
  }

  .player{
    height:52px;
  }

    font-size:11px;

    padding:6px;
  }
