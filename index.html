<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>1711 Chess Arena</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080b12;
  color: #fff;
  font-family: Arial, sans-serif;
}

#app {
  width: 100%;
  height: 100%;
  max-width: 600px;
  margin: auto;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at 50% 30%, #18253b, #080b12 70%);
}

/* HEADER */

.header {
  height: 58px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  background: rgba(5, 8, 15, .94);
  border-bottom: 1px solid #263047;
}

.logo {
  font-size: 17px;
  font-weight: 900;
}

.logo span {
  color: #32c9ff;
}

.online {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: #71f5a0;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #42ef7b;
  box-shadow: 0 0 9px #42ef7b;
}

/* PLAYER */

.player {
  height: 64px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 5px 14px;
  gap: 10px;
}

.player.bottom {
  flex-direction: row-reverse;
}

.avatar {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 13px;
  position: relative;
  overflow: hidden;
  border: 2px solid #52617c;
}

.avatar.red {
  background: linear-gradient(145deg,#ff536d,#741b35);
}

.avatar.blue {
  background: linear-gradient(145deg,#42c8ff,#1647a5);
}

.avatar-head {
  position: absolute;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: #ffd0a6;
  top: 7px;
  left: 50%;
  transform: translateX(-50%);
}

.avatar-body {
  position: absolute;
  width: 31px;
  height: 23px;
  border-radius: 15px 15px 5px 5px;
  background: #fff;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
}

.avatar.red .avatar-body {
  background: #ffdce1;
}

.avatar.blue .avatar-body {
  background: #d9f7ff;
}

.info {
  min-width: 0;
}

.name {
  font-size: 14px;
  font-weight: 800;
}

.rating {
  font-size: 10px;
  color: #8d99b0;
  margin-top: 3px;
}

.timer {
  margin-left: auto;
  min-width: 68px;
  text-align: center;
  padding: 8px 9px;
  border-radius: 10px;
  background: #151c2a;
  border: 1px solid #36425a;
  font-size: 16px;
  font-weight: 900;
}

.bottom .timer {
  margin-left: 0;
  margin-right: auto;
}

/* BOARD */

.board-wrap {
  width: min(94vw, 540px);
  aspect-ratio: 1 / 1;
  margin: auto;
  position: relative;
  flex-shrink: 1;
  min-height: 0;
}

#board {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 0 0 3px #303c55,
    0 15px 45px rgba(0,0,0,.65);
}

/* CONTROLS */

.controls {
  height: 58px;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  gap: 9px;
  padding: 8px;
}

button {
  border: 0;
  border-radius: 11px;
  padding: 10px 16px;
  color: #fff;
  font-weight: 800;
  background: linear-gradient(135deg,#2878ff,#6549ff);
  cursor: pointer;
}

button.secondary {
  background: #171e2d;
  border: 1px solid #35415a;
}

.status {
  height: 23px;
  flex-shrink: 0;
  text-align: center;
  color: #8d99ae;
  font-size: 10px;
}

/* SMALL SCREEN */

@media (max-height: 700px) {

  .header {
    height: 50px;
  }

  .player {
    height: 53px;
  }

  .avatar {
    width: 40px;
    height: 40px;
  }

  .name {
    font-size: 12px;
  }

  .timer {
    font-size: 13px;
    min-width: 60px;
    padding: 6px;
  }

  .controls {
    height: 49px;
  }

  button {
    padding: 8px 13px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->

  <div class="header">
    <div class="logo">
      ♟ <span>1711</span> CHESS ARENA
    </div>

    <div class="online">
      <div class="dot"></div>
      ONLINE
    </div>
  </div>


  <!-- OPPONENT -->

  <div class="player">

    <div class="avatar red">
      <div class="avatar-head"></div>
      <div class="avatar-body"></div>
    </div>

    <div class="info">
      <div class="name">Opponent</div>
      <div class="rating">Rating 1200</div>
    </div>

    <div class="timer" id="enemyTime">
      10:00
    </div>

  </div>


  <!-- CHESS BOARD -->

  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>


  <!-- PLAYER -->

  <div class="player bottom">

    <div class="avatar blue">
      <div class="avatar-head"></div>
      <div class="avatar-body"></div>
    </div>

    <div class="info">
      <div class="name">1711 Player</div>
      <div class="rating">Rating 1200</div>
    </div>

    <div class="timer" id="myTime">
      10:00
    </div>

  </div>


  <!-- BUTTONS -->

  <div class="controls">
    <button onclick="newGame()">♟ Game Baru</button>
    <button class="secondary" onclick="findOpponent()">⚔ Cari Lawan</button>
  </div>

  <div class="status" id="status">
    Pilih bidak untuk mulai bermain
  </div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>


<script>

/* =====================================================
   CHECK THREE.JS
===================================================== */

if (typeof THREE === "undefined") {

  document.getElementById("status").textContent =
    "Three.js gagal dimuat. Coba refresh halaman.";

  throw new Error("Three.js tidak tersedia");

}


/* =====================================================
   BASIC THREE.JS
===================================================== */

const canvas = document.getElementById("board");

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x0a0e17);


/* =====================================================
   CAMERA — BENAR-BENAR DARI ATAS
===================================================== */

const camera =
  new THREE.OrthographicCamera(
    -4.5,
     4.5,
     4.5,
    -4.5,
    0.1,
    100
  );

camera.position.set(
  0,
  15,
  0
);

camera.lookAt(
  0,
  0,
  0
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
  new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;


/* =====================================================
   LIGHT
===================================================== */

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    2.8
  )
);

const directional =
  new THREE.DirectionalLight(
    0xffffff,
    3.5
  );

directional.position.set(
  -4,
  12,
  5
);

directional.castShadow = true;

scene.add(directional);


/* =====================================================
   BOARD
===================================================== */

const board = new THREE.Group();

scene.add(board);


/*
   SETIAP KOTAK:

   total = 1 x 1
   border = biru
   bagian dalam = 0.86 x 0.86

   Jadi SEMUA kotak sama besar.
*/

const TILE = 1;

const BORDER = 0.98;

const INNER = 0.84;


/* WARNA PAPAN */

const LIGHT_COLOR = 0xe0b978;

const DARK_COLOR = 0x70442e;

const BORDER_COLOR = 0x279cff;


/* FRAME */

const frame =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      8.35,
      .30,
      8.35
    ),
    new THREE.MeshStandardMaterial({
      color: 0x151c2b,
      roughness: .55,
      metalness: .25
    })
  );

frame.position.y = -.22;

board.add(frame);


/* =====================================================
   64 KOTAK PAPAN
===================================================== */

const squares = [];

for (
  let row = 0;
  row < 8;
  row++
) {

  for (
    let col = 0;
    col < 8;
    col++
  ) {

    const group =
      new THREE.Group();

    const x =
      (col - 3.5) * TILE;

    const z =
      (row - 3.5) * TILE;

    group.position.set(
      x,
      0,
      z
    );


    /* BORDER */

    const border =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          BORDER,
          .18,
          BORDER
        ),
        new THREE.MeshStandardMaterial({
          color: BORDER_COLOR,
          roughness: .5,
          metalness: .15
        })
      );

    border.position.y = 0;

    group.add(border);


    /* INNER */

    const color =
      (row + col) % 2 === 0
      ? LIGHT_COLOR
      : DARK_COLOR;

    const inner =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          INNER,
          .21,
          INNER
        ),
        new THREE.MeshStandardMaterial({
          color: color,
          roughness: .65,
          metalness: .05
        })
      );

    inner.position.y = .04;

    inner.userData.row = row;
    inner.userData.col = col;
    inner.userData.isSquare = true;

    group.add(inner);

    squares.push(inner);

    board.add(group);

  }
}


/* =====================================================
   PIECE MATERIAL
===================================================== */

const whiteMain =
  new THREE.MeshStandardMaterial({
    color: 0xf7e7c5,
    roughness: .3,
    metalness: .35
  });

const whiteColor =
  new THREE.MeshStandardMaterial({
    color: 0x27cfff,
    roughness: .22,
    metalness: .55
  });

const blackMain =
  new THREE.MeshStandardMaterial({
    color: 0x252b3b,
    roughness: .3,
    metalness: .4
  });

const blackColor =
  new THREE.MeshStandardMaterial({
    color: 0xff4664,
    roughness: .2,
    metalness: .5
  });


/* =====================================================
   HELPERS
===================================================== */

function cyl(
  radiusTop,
  radiusBottom,
  height,
  material
) {

  const mesh =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radiusTop,
        radiusBottom,
        height,
        24
      ),
      material
    );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  return mesh;
}


function sph(
  radius,
  material
) {

  const mesh =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        radius,
        20,
        14
      ),
      material
    );

  mesh.castShadow = true;

  return mesh;
}


function cube(
  width,
  height,
  depth,
  material
) {

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      material
    );

  mesh.castShadow = true;

  return mesh;
}


/* =====================================================
   PAWN
===================================================== */

function pawn(main, accent) {

  const g =
    new THREE.Group();

  let m =
    cyl(.34,.38,.13,accent);

  m.position.y=.12;
  g.add(m);

  m =
    cyl(.20,.27,.32,main);

  m.position.y=.34;
  g.add(m);

  m =
    cyl(.13,.17,.12,accent);

  m.position.y=.56;
  g.add(m);

  m =
    sph(.18,main);

  m.position.y=.73;
  g.add(m);

  return g;
}


/* =====================================================
   ROOK
===================================================== */

function rook(main,accent) {

  const g =
    new THREE.Group();

  let m =
    cyl(.34,.39,.14,accent);

  m.position.y=.12;
  g.add(m);

  m =
    cyl(.24,.29,.45,main);

  m.position.y=.40;
  g.add(m);

  m =
    cyl(.31,.31,.13,accent);

  m.position.y=.68;
  g.add(m);

  for(let i=0;i<4;i++){

    const a =
      i * Math.PI / 2;

    m =
      cube(
        .12,
        .13,
        .12,
        main
      );

    m.position.set(
      Math.cos(a)*.21,
      .79,
      Math.sin(a)*.21
    );

    g.add(m);
  }

  return g;
}


/* =====================================================
   BISHOP
===================================================== */

function bishop(main,accent) {

  const g =
    new THREE.Group();

  let m =
    cyl(.34,.39,.14,accent);

  m.position.y=.12;
  g.add(m);

  m =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        .26,
        .48,
        20
      ),
      main
    );

  m.position.y=.43;
  m.castShadow=true;

  g.add(m);

  m =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .16,
        .035,
        12,
        24
      ),
      accent
    );

  m.rotation.x =
    Math.PI / 2;

  m.position.y=.68;

  g.add(m);

  m =
    sph(.13,main);

  m.position.y=.78;

  g.add(m);

  return g;
}


/* =====================================================
   KNIGHT
===================================================== */

function knight(main,accent) {

  const g =
    new THREE.Group();

  let m =
    cyl(.34,.39,.14,accent);

  m.position.y=.12;
  g.add(m);

  m =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        .29,
        .48,
        8
      ),
      main
    );

  m.position.y=.40;
  m.castShadow=true;

  g.add(m);

  m =
    sph(.20,main);

  m.position.set(
    .04,
    .72,
    0
  );

  g.add(m);

  m =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        .08,
        .22,
        4
      ),
      accent
    );

  m.position.set(
    .12,
    .90,
    0
  );

  g.add(m);

  return g;
}


/* =====================================================
   QUEEN
===================================================== */

function queen(main,accent) {

  const g =
    new THREE.Group();

  let m =
    cyl(.35,.40,.14,accent);

  m.position.y=.12;
  g.add(m);

  m =
    cyl(.17,.28,.50,main);

  m.position.y=.43;
  g.add(m);

  m =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .20,
        .035,
        12,
        24
      ),
      accent
    );

  m.rotation.x =
    Math.PI / 2;

  m.position.y=.69;

  g.add(m);

  m =
    sph(.12,main);

  m.position.y=.84;

  g.add(m);

  for(let i=0;i<5;i++){

    const a =
      i * Math.PI * 2 / 5;

    m =
      sph(.055,accent);

    m.position.set(
      Math.cos(a)*.18,
      .79,
      Math.sin(a)*.18
    );

    g.add(m);
  }

  return g;
}


/* =====================================================
   KING
===================================================== */

function king(main,accent) {

  const g =
    queen(main,accent);

  let m =
    cube(
      .09,
      .30,
      .09,
      accent
    );

  m.position.y=1.02;

  g.add(m);

  m =
    cube(
      .25,
      .08,
      .09,
      accent
    );

  m.position.y=1.05;

  g.add(m);

  return g;
}


/* =====================================================
   CREATE PIECE
===================================================== */

function createPiece(type) {

  const isWhite =
    type === type.toUpperCase();

  const main =
    isWhite
    ? whiteMain
    : blackMain;

  const accent =
    isWhite
    ? whiteColor
    : blackColor;

  switch(type.toLowerCase()) {

    case "p":
      return pawn(main,accent);

    case "r":
      return rook(main,accent);

    case "n":
      return knight(main,accent);

    case "b":
      return bishop(main,accent);

    case "q":
      return queen(main,accent);

    case "k":
      return king(main,accent);

  }

  return null;
}


/* =====================================================
   CHESS START POSITION
===================================================== */

const startPosition = [

  ["r","n","b","q","k","b","n","r"],

  ["p","p","p","p","p","p","p","p"],

  [null,null,null,null,null,null,null,null],

  [null,null,null,null,null,null,null,null],

  [null,null,null,null,null,null,null,null],

  [null,null,null,null,null,null,null,null],

  ["P","P","P","P","P","P","P","P"],

  ["R","N","B","Q","K","B","N","R"]

];


let gameBoard =
  startPosition.map(
    row => [...row]
  );


const pieceObjects = [];


/* =====================================================
   PLACE ALL PIECES
===================================================== */

function loadPieces() {

  for(let row=0;row<8;row++){

    for(let col=0;col<8;col++){

      const type =
        gameBoard[row][col];

      if(!type) continue;

      const piece =
        createPiece(type);

      if(!piece) continue;

      piece.position.set(
        col - 3.5,
        .22,
        row - 3.5
      );

      piece.userData.type = type;
      piece.userData.row = row;
      piece.userData.col = col;
      piece.userData.isPiece = true;

      board.add(piece);

      pieceObjects.push(piece);
    }
  }
}

loadPieces();


/* =====================================================
   SELECT / MOVE
===================================================== */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

let selected = null;


canvas.addEventListener(
  "pointerdown",
  function(event) {

    const rect =
      canvas.getBoundingClientRect();

    mouse.x =
      ((event.clientX - rect.left)
      / rect.width) * 2 - 1;

    mouse.y =
      -((event.clientY - rect.top)
      / rect.height) * 2 + 1;

    raycaster.setFromCamera(
      mouse,
      camera
    );


    /* PIECE */

    const hits =
      raycaster.intersectObjects(
        pieceObjects,
        true
      );

    if(hits.length) {

      let obj =
        hits[0].object;

      while(
        obj.parent &&
        !obj.userData.isPiece
      ) {

        obj=obj.parent;

      }

      if(obj.userData.isPiece) {

        selected=obj;

        document.getElementById(
          "status"
        ).textContent =
          "Bidak dipilih — pilih kotak tujuan";

      }

      return;
    }


    /* SQUARE */

    const squareHits =
      raycaster.intersectObjects(
        squares,
        false
      );

    if(
      squareHits.length &&
      selected
    ) {

      const target =
        squareHits[0].object;

      const row =
        target.userData.row;

      const col =
        target.userData.col;

      moveSelected(
        row,
        col
      );
    }

  }
);


/* =====================================================
   MOVE
===================================================== */

function moveSelected(row,col) {

  if(!selected) return;

  const oldRow =
    selected.userData.row;

  const oldCol =
    selected.userData.col;


  /* REMOVE TARGET */

  for(
    let i=pieceObjects.length-1;
    i>=0;
    i--
  ) {

    const p =
      pieceObjects[i];

    if(
      p.userData.row === row &&
      p.userData.col === col
    ) {

      board.remove(p);

      pieceObjects.splice(i,1);

    }

  }


  gameBoard[row][col] =
    gameBoard[oldRow][oldCol];

  gameBoard[oldRow][oldCol] =
    null;


  selected.userData.row =
    row;

  selected.userData.col =
    col;


  selected.position.set(
    col - 3.5,
    .22,
    row - 3.5
  );


  selected =
    null;


  document.getElementById(
    "status"
  ).textContent =
    "Langkah dilakukan";
}


/* =====================================================
   NEW GAME
===================================================== */

function newGame() {

  location.reload();

}


/* =====================================================
   FIND OPPONENT
===================================================== */

function findOpponent() {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    "⚔ Mencari lawan...";

  setTimeout(
    function() {

      status.textContent =
        "⚔ Lawan ditemukan!";

    },
    1500
  );

}


/* =====================================================
   TIMER
===================================================== */

let myTime = 600;

let enemyTime = 600;

setInterval(
  function() {

    if(myTime > 0)
      myTime--;

    if(enemyTime > 0)
      enemyTime--;

    document.getElementById(
      "myTime"
    ).textContent =
      formatTime(myTime);

    document.getElementById(
      "enemyTime"
    ).textContent =
      formatTime(enemyTime);

  },
  1000
);


function formatTime(sec) {

  const min =
    Math.floor(sec / 60)
    .toString()
    .padStart(2,"0");

  const seconds =
    (sec % 60)
    .toString()
    .padStart(2,"0");

  return min + ":" + seconds;
}


/* =====================================================
   RESIZE
===================================================== */

function resizeBoard() {

  const box =
    canvas.parentElement
    .getBoundingClientRect();

  const width =
    Math.max(
      1,
      Math.floor(box.width)
    );

  const height =
    Math.max(
      1,
      Math.floor(box.height)
    );

  renderer.setSize(
    width,
    height,
    false
  );


  const aspect =
    width / height;

  const size = 4.5;

  camera.left =
    -size * aspect;

  camera.right =
     size * aspect;

  camera.top =
     size;

  camera.bottom =
    -size;

  camera.updateProjectionMatrix();

}


window.addEventListener(
  "resize",
  resizeBoard
);

resizeBoard();


/* =====================================================
   RENDER LOOP
===================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
