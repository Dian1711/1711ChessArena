<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>1711 Chess Arena</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #252525 0%,
          #101010 50%,
          #050505 100%
        );

      color: #ffffff;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }


    /* =========================================
       APP
    ========================================= */

    .app {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 14px 12px 28px;
    }


    /* =========================================
       HEADER
    ========================================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(
          145deg,
          #b98752,
          #684326
        );

      box-shadow:
        0 0 18px rgba(185, 135, 82, .35),
        inset 0 1px 2px rgba(255,255,255,.35);

      font-size: 25px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
    }

    .brand-sub {
      margin-top: 2px;

      color: #999999;

      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 6px;

      padding: 7px 10px;

      border-radius: 20px;

      background: #191919;

      border: 1px solid #3c3c3c;

      color: #aaaaaa;

      font-size: 11px;
    }

    .online-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #43dc80;

      box-shadow: 0 0 9px #43dc80;
    }


    /* =========================================
       PLAYER
    ========================================= */

    .player {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 10px 12px;

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          #242424,
          #111111
        );

      border: 1px solid #3b3b3b;

      box-shadow:
        0 8px 22px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.05);
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #7b5638,
          #302319
        );

      border: 2px solid #b88a5b;

      font-size: 24px;

      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.12),
        0 5px 12px rgba(0,0,0,.4);
    }

    .avatar.enemy {
      background:
        linear-gradient(
          145deg,
          #292929,
          #080808
        );

      border-color: #555555;
    }

    .player-name {
      font-size: 14px;
      font-weight: 800;
    }

    .player-rating {
      margin-top: 4px;

      color: #999999;

      font-size: 11px;
    }

    .timer {
      min-width: 75px;

      padding: 8px 10px;

      text-align: center;

      border-radius: 11px;

      background: #080808;

      border: 1px solid #404040;

      font-size: 19px;
      font-weight: 900;

      font-variant-numeric: tabular-nums;

      box-shadow:
        inset 0 2px 6px rgba(0,0,0,.8);
    }

    .timer.active {
      border-color: #b88751;

      box-shadow:
        0 0 12px rgba(184,135,81,.25),
        inset 0 2px 6px rgba(0,0,0,.8);
    }


    /* =========================================
       BOARD CONTAINER
    ========================================= */

    .board-area {
      margin-top: 12px;

      padding: 8px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #303030,
          #111111
        );

      border: 1px solid #4a4a4a;

      box-shadow:
        0 16px 35px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08);
    }


    /* =========================================
       CHESS BOARD
    ========================================= */

    .board {
      width: 100%;

      aspect-ratio: 1 / 1;

      display: grid;

      grid-template-columns:
        repeat(8, minmax(0, 1fr));

      grid-template-rows:
        repeat(8, minmax(0, 1fr));

      overflow: hidden;

      border-radius: 8px;

      border: 3px solid #191919;

      background: #888888;

      box-shadow:
        0 10px 25px rgba(0,0,0,.5);
    }


    /* =========================================
       SQUARE
    ========================================= */

    .square {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      min-width: 0;
      min-height: 0;

      cursor: pointer;

      user-select: none;

      border: 1px solid #6f6f6f;

      transition:
        filter .12s ease;
    }


    /* PUTIH */
    .square.light {
      background:
        linear-gradient(
          145deg,
          #ffffff,
          #eeeeee
        );

      border-color: #b7b7b7;
    }


    /* ABU-ABU */
    .square.dark {
      background:
        linear-gradient(
          145deg,
          #a5a5a5,
          #888888
        );

      border-color: #696969;
    }

    .square:hover {
      filter: brightness(1.08);
    }


    /* SELECTED */

    .square.selected {
      box-shadow:
        inset 0 0 0 3px #d7a04d,
        inset 0 0 18px rgba(215,160,77,.4);
    }


    /* POSSIBLE MOVE */

    .square.possible::after {
      content: "";

      position: absolute;

      width: 21%;
      height: 21%;

      border-radius: 50%;

      background: rgba(80, 160, 80, .7);

      z-index: 1;
    }


    /* CAPTURE */

    .square.capture::after {
      content: "";

      position: absolute;

      width: 73%;
      height: 73%;

      border-radius: 50%;

      border: 4px solid rgba(170,50,50,.75);

      z-index: 1;
    }


    /* =========================================
       COORDINATES
    ========================================= */

    .coord-file,
    .coord-rank {
      position: absolute;

      font-size: 8px;

      font-weight: 900;

      opacity: .65;

      pointer-events: none;

      z-index: 5;
    }

    .coord-file {
      right: 3px;
      bottom: 2px;
    }

    .coord-rank {
      left: 3px;
      top: 2px;
    }

    .square.light .coord-file,
    .square.light .coord-rank {
      color: #555555;
    }

    .square.dark .coord-file,
    .square.dark .coord-rank {
      color: #eeeeee;
    }


    /* =========================================
       PIECES
    ========================================= */

    .piece {
      position: relative;

      width: 91%;
      height: 95%;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 3;

      pointer-events: none;
    }

    .piece svg {
      width: 100%;
      height: 100%;

      display: block;

      overflow: visible;
    }


    /* =========================================
       STATUS
    ========================================= */

    .status {
      margin-top: 10px;

      padding: 9px 12px;

      text-align: center;

      border-radius: 11px;

      background: #121212;

      border: 1px solid #333333;

      color: #999999;

      font-size: 12px;
    }

    .status strong {
      color: #d19a55;
    }


    /* =========================================
       BUTTONS
    ========================================= */

    .buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 11px;
    }

    .btn {
      border: 0;

      border-radius: 13px;

      padding: 13px 10px;

      color: white;

      font-size: 13px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 6px 15px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.18);
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn-brown {
      background:
        linear-gradient(
          145deg,
          #bd8950,
          #714521
        );
    }

    .btn-dark {
      background:
        linear-gradient(
          145deg,
          #454545,
          #171717
        );

      border: 1px solid #555555;
    }


    /* =========================================
       INFO
    ========================================= */

    .info {
      margin-top: 13px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;
    }

    .info-box {
      padding: 10px 7px;

      text-align: center;

      border-radius: 12px;

      background: #151515;

      border: 1px solid #303030;
    }

    .info-value {
      font-size: 14px;
      font-weight: 900;
    }

    .info-label {
      margin-top: 3px;

      color: #777777;

      font-size: 9px;

      text-transform: uppercase;

      letter-spacing: .7px;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 390px) {

      .app {
        padding-left: 8px;
        padding-right: 8px;
      }

      .board-area {
        padding: 5px;
      }

      .piece {
        width: 94%;
        height: 97%;
      }

      .timer {
        min-width: 67px;
        font-size: 17px;
      }

      .avatar {
        width: 40px;
        height: 40px;
        font-size: 21px;
      }
    }

  </style>
</head>


<body>

<main class="app">


  <!-- =====================================
       HEADER
  ====================================== -->

  <header class="header">

    <div class="brand">

      <div class="brand-icon">

      </div>

  <!-- =====================================

  ====================================== -->

  <section class="player">

    </div>


    <div class="info-box">

      <div class="info-value">

      </div>

      <div class="info-label">

    <div class="info-box">

      <div class="info-value">
        0
      </div>

      <div class="info-label">
        Kalah
      </div>

    </div>

  </div>

</main>



<!-- =========================================
     SVG DEFINITIONS
========================================= -->

<svg
  width="0"
  height="0"
  style="position:absolute"
  aria-hidden="true"
>

  <defs>


    <!-- LIGHT BROWN -->
    <linearGradient
      id="brownPiece"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >

      <stop
        offset="0%"
        stop-color="#fff0c9"
      />

      <stop
        offset="20%"
        stop-color="#d9b27b"
      />

      <stop
        offset="48%"
        stop-color="#b27a43"
      />

      <stop
        offset="75%"
        stop-color="#805127"
      />

      <stop
        offset="100%"
        stop-color="#4d2d17"
      />

    </linearGradient>


    <!-- BLACK -->
    <linearGradient
      id="blackPiece"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >

      <stop
        offset="0%"
        stop-color="#666666"
      />

      <stop
        offset="25%"
        stop-color="#343434"
      />

      <stop
        offset="50%"
        stop-color="#1d1d1d"
      />

      <stop
        offset="78%"
        stop-color="#0b0b0b"
      />

      <stop
        offset="100%"
        stop-color="#000000"
      />

    </linearGradient>


    <!-- BROWN ACCENT -->
    <linearGradient
      id="brownAccent"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >

      <stop
        offset="0%"
        stop-color="#ffe0a0"
      />

      <stop
        offset="50%"
        stop-color="#c88d4d"
      />

      <stop
        offset="100%"
        stop-color="#6a3d1c"
      />

    </linearGradient>


    <!-- BLACK ACCENT -->
    <linearGradient
      id="blackAccent"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >

      <stop
        offset="0%"
        stop-color="#999999"
      />

      <stop
        offset="50%"
        stop-color="#555555"
      />

      <stop
        offset="100%"
        stop-color="#1b1b1b"
      />

    </linearGradient>


    <filter
      id="pieceShadow"
      x="-40%"
      y="-40%"
      width="180%"
      height="190%"
    >

      <feDropShadow
        dx="3"
        dy="5"
        stdDeviation="2.5"
        flood-color="#000000"
        flood-opacity=".65"
      />

    </filter>

  </defs>

</svg>



<script>


/* =========================================
   INITIAL CHESS POSITION
========================================= */

const initialBoard = [

  ["br","bn","bb","bq","bk","bb","bn","br"],

  ["bp","bp","bp","bp","bp","bp","bp","bp"],

  [null,null,null,null,null,null,null,null],

  [null,null,null,null,null,null,null,null],

  [null,null,null,null,null,null,null,null],

  [null,null,null,null,null,null,null,null],

  ["wp","wp","wp","wp","wp","wp","wp","wp"],

  ["wr","wn","wb","wq","wk","wb","wn","wr"]

];


let boardState =
  JSON.parse(
    JSON.stringify(initialBoard)
  );


let selectedSquare = null;

let currentTurn = "w";



/* =========================================
   PIECE SVG
========================================= */

function pieceSVG(type, side) {

  const main =
    side === "w"
      ? "url(#brownPiece)"
      : "url(#blackPiece)";

  const accent =
    side === "w"
      ? "url(#brownAccent)"
      : "url(#blackAccent)";

  const outline =
    side === "w"
      ? "#40230f"
      : "#000000";


  const start = `

    <svg
      viewBox="0 0 100 120"
      xmlns="http://www.w3.org/2000/svg"
    >

      <g
        filter="url(#pieceShadow)"
        stroke="${outline}"
        stroke-width="2.4"
        stroke-linejoin="round"
        stroke-linecap="round"
      >

  `;


  const end = `

      </g>

    </svg>

  `;



  /* =====================================
     PAWN
  ====================================== */

  if (type === "p") {

    return start + `

      <!-- HEAD -->

      <circle
        cx="50"
        cy="25"
        r="14"
        fill="${main}"
      />


      <!-- BODY -->

      <path
        d="
          M41 38
          C42 45 42 50 38 57
          C36 61 34 67 37 73
          L29 92
          C24 94 20 98 20 105
          C20 111 34 114 50 114
          C66 114 80 111 80 105
          C80 98 76 94 71 92
          L63 73
          C66 67 64 61 62 57
          C58 50 58 45 59 38
          Z
        "
        fill="${main}"
      />


      <!-- COLLAR -->

      <ellipse
        cx="50"
        cy="74"
        rx="14"
        ry="5"
        fill="${accent}"
      />


      <!-- BASE -->

      <path
        d="
          M23 98
          C34 103 66 103 77 98
        "
        fill="none"
        stroke="${accent}"
        stroke-width="4"
      />


    ` + end;

  }



  /* =====================================
     ROOK
  ====================================== */

  if (type === "r") {

    return start + `

      <!-- BATTLEMENT -->

      <path
        d="
          M22 40
          L22 18
          L34 18
          L34 28
          L43 28
          L43 18
          L57 18
          L57 28
          L66 28
          L66 18
          L78 18
          L78 40
          Z
        "
        fill="${main}"
      />


      <!-- TOWER -->

      <path
        d="
          M29 40
          L71 40
          L67 78
          L73 91
          L79 97
          L79 106
          C79 111 66 114 50 114
          C34 114 21 111 21 106
          L21 97
          L27 91
          L33 78
          Z
        "
        fill="${main}"
      />


      <!-- TOP LINE -->

      <path
        d="M23 40 L77 40"
        fill="none"
        stroke="${accent}"
        stroke-width="4"
      />


      <!-- BODY LINE -->

      <path
        d="M31 50 L69 50"
        fill="none"
        stroke="${accent}"
        stroke-width="3"
      />


      <!-- BASE -->

      <path
        d="M23 101 C35 108 65 108 77 101"
        fill="none"
        stroke="${accent}"
        stroke-width="4"
      />

    ` + end;

  }



  /* =====================================
     BISHOP
  ====================================== */

  if (type === "b") {

    return start + `

      <!-- HEAD -->

      <path
        d="
          M50 11
          C61 17 66 26 64 36
          C63 44 57 50 57 56
          C57 64 66 78 73 92
          L79 98
          L79 106
          C79 111 66 114 50 114
          C34 114 21 111 21 106
          L21 98
          L27 92
          C34 78 43 64 43 56
          C43 50 37 44 36 36
          C34 26 39 17 50 11
          Z
        "
        fill="${main}"
      />


      <!-- MITER -->

      <path
        d="
          M50 14
          L39 43
          L50 51
          L61 43
          Z
        "
        fill="${main}"
      />


      <!-- SLIT -->

      <path
        d="M58 22 L43 44"
        fill="none"
        stroke="${accent}"
        stroke-width="4"
      />


      <!-- COLLAR -->

      <path
        d="M42 58 C47 63 53 63 58 58"
        fill="none"
        stroke="${accent}"
        stroke-width="3"
      />


      <!-- BASE -->

      <path
        d="M24 101 C35 108 65 108 76 101"
        fill="none"
        stroke="${accent}"
        stroke-width="4"
      />

    ` + end;

  }



  /* =====================================
     KNIGHT — KUDA
  ====================================== */

  if (type === "n") {

    return start + `

      <!--
        HEAD + NECK KUDA
        Bentuk dibuat seperti kepala
        kuda catur klasik.
      -->

      <path
        d="

          M31 101

          C34 92 39 87 41 79

          C43 72 41 66 37 60

          C32 53 28 46 29 39

          C30 29 37 21 47 17

          C53 14 59 13 65 14

          L70 22

          L77 19

          L72 30

          C77 34 81 39 82 44

          L72 48

          C74 56 72 64 68 70

          C64 76 58 80 55 86

          C53 90 55 96 61 103

          Z

        "
        fill="${main}"
      />


      <!-- TELINGA KUDA -->

      <path
        d="
          M48 18
          L47 6
          L56 15
          Z
        "
        fill="${main}"
      />

      <path
        d="
          M60 16
          L66 6
          L68 22
          Z
        "
        fill="${main}"
      />


      <!-- MANE / SURAI -->

      <path
        d="
          M31 39
          C25 48 31 58 38 65
          C43 70 44 76 40 86
          L47 80
          C52 76 56 70 57 64

          C51 60 48 54 47 48

          C45 39 49 30 57 22

          L45 23

          C39 27 34 32 31 39

          Z
        "
        fill="${accent}"
      />


      <!-- MONCONG KUDA -->

      <path
        d="
          M61 34
          C68 34 74 38 81 44
          L72 49
          L62 45
          Z
        "
        fill="${main}"
      />


      <!-- HIDUNG -->

      <ellipse
        cx="76"
        cy="45"
        rx="3"
        ry="2"
        fill="${accent}"
      />


      <!-- MATA -->

      <circle
        cx="62"
        cy="31"
        r="3"
        fill="#17100b"
      />

      <circle
        cx="63"
        cy="30"
        r="1"
        fill="#ffffff"
        stroke="none"
      />


      <!-- LEHER / DADA -->

      <path
        d="
          M40 78
          C45 84 47 91 43 103

          L62 103

          C56 94 54 86 59 76

          C53 81 46 82 40 78

          Z
        "
        fill="${main}"
      />


      <!-- GARIS LEHER -->

      <path
        d="
          M37 61
          C43 67 48 70 54 71
        "
        fill="none"
        stroke="${accent}"
        stroke-width="3"
      />


      <!-- BASE -->

      <path
        d="
          M23 101
          C35 108 65 108 77 101
        "
        fill="none"
        stroke="${accent}"
        stroke-width="5"
      />

    ` + end;

  }



  /* =====================================
     QUEEN
  ====================================== */

  if (type === "q") {

    return start + `

      <!-- CROWN -->

      <path
        d="
          M25 49
          L20 20

/* =========================================
   CREATE PIECE
========================================= */

function createPiece(code) {

  if (!code) {
    return null;
  }

  const side = code[0];
  const type = code[1];

  const element =
    document.createElement("div");

  element.className =
    "piece " +
    (side === "w" ? "white" : "black");

  element.innerHTML =
    pieceSVG(type, side);

  return element;
}



/* =========================================
   DRAW BOARD
========================================= */

function drawBoard() {

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  const files =
    ["a","b","c","d","e","f","g","h"];


  for (
    let row = 0;
    row < 8;
    row++
  ) {

    for (
      let col = 0;
      col < 8;
      col++
    ) {

      const square =
        document.createElement("div");


      square.className =
        "square " +
        (
          (row + col) % 2 === 0
            ? "light"
            : "dark"
        );


      square.dataset.row = row;
      square.dataset.col = col;


      /* FILE */

      if (row === 7) {

        const file =
          document.createElement("span");

        file.className =
          "coord-file";

        file.textContent =
          files[col];

        square.appendChild(file);
      }


      /* RANK */

      if (col === 0) {

        const rank =
          document.createElement("span");

        rank.className =
          "coord-rank";

        rank.textContent =
          8 - row;

        square.appendChild(rank);
      }


      /* PIECE */

      const piece =
        boardState[row][col];

      if (piece) {

        const pieceElement =
          createPiece(piece);

        square.appendChild(
          pieceElement
        );
      }


      square.addEventListener(
        "click",
        function() {

          handleSquareClick(
            row,
            col
          );

        }
      );


      board.appendChild(square);

    }

  }


  updateSelection();

}



/* =========================================
   HANDLE SQUARE
========================================= */

function handleSquareClick(row, col) {

  const clickedPiece =
    boardState[row][col];


  /* PILIH BIDAK */

  if (!selectedSquare) {

    if (
      clickedPiece &&
      clickedPiece[0] === currentTurn
    ) {

      selectedSquare = {
        row: row,
        col: col
      };

      updateSelection();

      setStatus(
        "Pilih kotak tujuan"
      );

    }

    return;
  }


  /* PILIH BIDAK LAIN */

  if (
    clickedPiece &&
    clickedPiece[0] === currentTurn
  ) {

    selectedSquare = {
      row: row,
      col: col
    };

    updateSelection();

    return;
  }


  /* PINDAH */

  boardState[row][col] =
    boardState[
      selectedSquare.row
    ][selectedSquare.col];


  boardState[
    selectedSquare.row
  ][selectedSquare.col] =
    null;


  selectedSquare = null;


  currentTurn =
    currentTurn === "w"
      ? "b"
      : "w";


  drawBoard();


  setStatus(
    currentTurn === "w"
      ? "Giliran <strong>Putih</strong>"
      : "Giliran <strong>Hitam</strong>"
  );

}



/* =========================================
   SELECTION
========================================= */

function updateSelection() {

  const squares =
    document.querySelectorAll(
      ".square"
    );


  squares.forEach(
    function(square) {

      square.classList.remove(
        "selected",
        "possible",
        "capture"
      );


      if (!selectedSquare) {
        return;
      }


      const row =
        Number(
          square.dataset.row
        );

      const col =
        Number(
          square.dataset.col
        );


      if (
        row === selectedSquare.row &&
        col === selectedSquare.col
      ) {

        square.classList.add(
          "selected"
        );

        return;
      }


      const target =
        boardState[row][col];


      const distance =
        Math.abs(
          row - selectedSquare.row
        ) +
        Math.abs(
          col - selectedSquare.col
        );


      if (
        !target &&
        distance <= 2
      ) {

        square.classList.add(
          "possible"
        );

      }


      if (
        target &&
        target[0] !== currentTurn
      ) {

        square.classList.add(
          "capture"
        );

      }

    }
  );

}



/* =========================================
   STATUS
========================================= */

function setStatus(text) {

  document.getElementById(
    "status"
  ).innerHTML = text;

}



/* =========================================
   NEW GAME
========================================= */

function newGame() {

  boardState =
    JSON.parse(
      JSON.stringify(initialBoard)
    );


  selectedSquare = null;

  currentTurn = "w";


  mySeconds = 600;

  enemySeconds = 600;


  updateTimer(
    "myTimer",
    mySeconds
  );

  updateTimer(
    "enemyTimer",
    enemySeconds
  );


  drawBoard();


  setStatus(
    "Game baru dimulai — giliran <strong>Putih</strong>"
  );

}



/* =========================================
   FIND OPPONENT
========================================= */

function findOpponent() {

  setStatus(
    "⚔ <strong>Mencari lawan...</strong>"
  );


  setTimeout(
    function() {

      setStatus(
        "Lawan belum tersedia — mode demo aktif"
      );

    },
    1800
  );

}



/* =========================================
   TIMER
========================================= */

let mySeconds = 600;

let enemySeconds = 600;


setInterval(
  function() {

    if (currentTurn === "w") {

      if (mySeconds > 0) {
        mySeconds--;
      }

      updateTimer(
        "myTimer",
        mySeconds
      );

    } else {

      if (enemySeconds > 0) {
        enemySeconds--;
      }

      updateTimer(
        "enemyTimer",
        enemySeconds
      );

    }

  },
  1000
);



function updateTimer(
  id,
  seconds
) {

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;


  document.getElementById(id)
    .textContent =

      String(minutes)
        .padStart(2, "0")

      +

      ":" +

      String(secs)
        .padStart(2, "0");

}



/* =========================================
   START
========================================= */

drawBoard();
