<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>1711 Chess Arena</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#303030 0%,#141414 48%,#050505 100%);
  color:#fff;
}

body{
  min-height:100vh;
}

button{
  font-family:inherit;
}


/* =========================================
   APP
========================================= */

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:14px 12px 28px;
}


/* =========================================
   HEADER
========================================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:
    linear-gradient(145deg,#c69a68,#704722);

  box-shadow:
    0 0 18px rgba(190,140,80,.35),
    inset 0 1px 2px rgba(255,255,255,.4);

  font-size:25px;
}

.brand-title{
  font-size:20px;
  font-weight:900;
}

.brand-sub{
  margin-top:2px;
  color:#999;
  font-size:10px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;

  padding:7px 10px;

  border-radius:20px;

  background:#181818;
  border:1px solid #3c3c3c;

  color:#aaa;
  font-size:11px;
}

.online-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#43dc80;

  box-shadow:0 0 9px #43dc80;
}


/* =========================================
   PLAYER
========================================= */

.player{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:10px 12px;

  border-radius:16px;

  background:
    linear-gradient(145deg,#272727,#101010);

  border:1px solid #3b3b3b;

  box-shadow:
    0 8px 22px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.05);
}

.player-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:
    linear-gradient(145deg,#805c3b,#2f2116);

  border:2px solid #b88957;

  font-size:24px;
}

.avatar.enemy{
  background:
    linear-gradient(145deg,#333,#080808);

  border-color:#555;
}

.player-name{
  font-size:14px;
  font-weight:800;
}

.player-rating{
  margin-top:4px;
  color:#999;
  font-size:11px;
}

.timer{
  min-width:75px;

  padding:8px 10px;

  text-align:center;

  border-radius:11px;

  background:#080808;

  border:1px solid #404040;

  font-size:19px;
  font-weight:900;

  font-variant-numeric:tabular-nums;

  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.8);
}

.timer.active{
  border-color:#b88751;

  box-shadow:
    0 0 12px rgba(184,135,81,.25),
    inset 0 2px 6px rgba(0,0,0,.8);
}


/* =========================================
   BOARD FRAME
========================================= */

.board-area{
  margin-top:12px;

  padding:8px;

  border-radius:18px;

  background:
    linear-gradient(145deg,#3b3b3b,#111);

  border:1px solid #505050;

  box-shadow:
    0 16px 35px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.08);
}


/* =========================================
   BOARD
========================================= */

.board{
  width:100%;

  aspect-ratio:1 / 1;

  display:grid;

  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));

  overflow:hidden;

  border-radius:7px;

  border:3px solid #181818;

  box-shadow:
    0 10px 25px rgba(0,0,0,.5);
}


/* =========================================
   SQUARE
========================================= */

.square{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:0;
  min-height:0;

  border:1px solid rgba(70,70,70,.65);

  cursor:pointer;
  user-select:none;
}

.square.light{
  background:
    linear-gradient(
      145deg,
      #ffffff 0%,
      #f2f2f2 50%,
      #e7e7e7 100%
    );

  border-color:#c3c3c3;
}

.square.dark{
  background:
    linear-gradient(
      145deg,
      #aaaaaa 0%,
      #969696 50%,
      #858585 100%
    );

  border-color:#707070;
}

.square:hover{
  filter:brightness(1.08);
}

.square.selected{
  box-shadow:
    inset 0 0 0 3px #d49a45,
    inset 0 0 20px rgba(212,154,69,.38);
}

.square.possible::after{
  content:"";

  position:absolute;

  width:20%;
  height:20%;

  border-radius:50%;

  background:#5d9c62;

  box-shadow:
    0 0 5px rgba(0,0,0,.3);

  z-index:1;
}

.square.capture::after{
  content:"";

  position:absolute;

  width:72%;
  height:72%;

  border-radius:50%;

  border:4px solid rgba(160,55,55,.75);

  z-index:1;
}


/* =========================================
   COORDINATES
========================================= */

.coord-file,
.coord-rank{
  position:absolute;

  font-size:8px;
  font-weight:900;

  opacity:.62;

  pointer-events:none;

  z-index:5;
}

.coord-file{
  right:3px;
  bottom:2px;
}

.coord-rank{
  left:3px;
  top:2px;
}

.square.light .coord-file,
.square.light .coord-rank{
  color:#555;
}

.square.dark .coord-file,
.square.dark .coord-rank{
  color:#eee;
}


/* =========================================
   PIECES
========================================= */

.piece{
  width:94%;
  height:96%;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  z-index:3;

  pointer-events:none;
}

.piece svg{
  width:100%;
  height:100%;

  overflow:visible;
}


/* =========================================
   STATUS
========================================= */

.status{
  margin-top:10px;

  padding:9px 12px;

  text-align:center;

  border-radius:11px;

  background:#121212;

  border:1px solid #333;

  color:#999;

  font-size:12px;
}

.status strong{
  color:#d09a58;
}


/* =========================================
   BUTTONS
========================================= */

.buttons{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  margin-top:11px;
}

.btn{
  border:0;

  border-radius:13px;

  padding:13px 10px;

  color:#fff;

  font-size:13px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 6px 15px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.18);
}

.btn:active{
  transform:translateY(2px);
}

.btn-brown{
  background:
    linear-gradient(145deg,#c28c52,#70451f);
}

.btn-dark{
  background:
    linear-gradient(145deg,#4a4a4a,#171717);

  border:1px solid #555;
}


/* =========================================
   INFO
========================================= */

.info{
  margin-top:13px;

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;
}

.info-box{
  padding:10px 7px;

  text-align:center;

  border-radius:12px;

  background:#151515;

  border:1px solid #303030;
}

.info-value{
  font-size:14px;
  font-weight:900;
}

.info-label{
  margin-top:3px;

  color:#777;

  font-size:9px;

  text-transform:uppercase;

  letter-spacing:.7px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:390px){

  .app{
    padding-left:8px;
    padding-right:8px;
  }

  .board-area{
    padding:5px;
  }

  .piece{
    width:97%;
    height:98%;
  }

  .timer{
    min-width:67px;
    font-size:17px;
  }

  .avatar{
    width:40px;
    height:40px;
    font-size:21px;
  }

}

</style>
</head>


<body>

<main class="app">

========================================= -->

<svg

  height="0"

>

========================================= */

  [null,null,null,null,null,null,null,null],

  [null,null,null,null,null,null,null,null],

  ["wp","wp","wp","wp","wp","wp","wp","wp"],

  ["wr","wn","wb","wq","wk","wb","wn","wr"]

];

  JSON.parse(
    JSON.stringify(initialBoard)

let selectedSquare = null;

let currentTurn = "w";

      />


      <!-- base -->

        d="M23 99 C35 106 65 106 77 99"

  }



  /* =====================================
     ROOK
  ====================================== */

  if(type==="r"){

    return start + `

      <!-- crown -->
      <path

  /* =====================================

  ====================================== */

  if(type==="b"){

    return start + `

      <!-- bishop body -->

      <path
        d="

          C61 17 66 27 64 37

          C55 64 63 76 71 91

          L78 98
          L78 106

          C78 111 66 114 50 114

          C34 114 22 111 22 106

      <!-- bishop slit -->

  }



  /* =====================================

  ====================================== */

  if(type==="n"){

    return start + `

      <!--
        KUDA:

  /* =====================================

      <!-- body band -->

      />


      <!-- base -->

        d="M23 103 C35 110 65 110 77 103"
        fill="none"

  /* =====================================

  if(type==="k"){

/* =========================================
   CREATE PIECE
========================================= */

function createPiece(code){

  if(!code){
    return null;
  }

  const side = code[0];
  const type = code[1];

  const piece =
    document.createElement("div");

  piece.className =
    "piece " +
    (side === "w" ? "white" : "black");

  piece.innerHTML =
    pieceSVG(type,side);

  return piece;
}



/* =========================================
   DRAW BOARD
========================================= */

function drawBoard(){

  const board =
    document.getElementById("board");

  board.innerHTML="";

  const files =
    ["a","b","c","d","e","f","g","h"];


  for(let row=0;row<8;row++){

    for(let col=0;col<8;col++){

      const square =
        document.createElement("div");


      square.className =
        "square " +
        (
          (row + col) % 2 === 0
            ? "light"
            : "dark"
        );


      square.dataset.row=row;
      square.dataset.col=col;


      /* FILE */

      if(row===7){

        const file =
          document.createElement("span");

        file.className="coord-file";

        file.textContent=files[col];

        square.appendChild(file);

      }


      /* RANK */

      if(col===0){

        const rank =
          document.createElement("span");

        rank.className="coord-rank";

        rank.textContent=8-row;

        square.appendChild(rank);

      }


      /* PIECE */

      const code =
        boardState[row][col];

      if(code){

        const piece =
          createPiece(code);

        square.appendChild(piece);

      }


      square.addEventListener(
        "click",
        function(){

          handleSquareClick(
            row,
            col
          );

        }
      );


      board.appendChild(square);

    }

  }


  updateSelection();

}



/* =========================================
   CLICK
========================================= */

function handleSquareClick(row,col){

  const target =
    boardState[row][col];


  /* SELECT */

  if(!selectedSquare){

    if(
      target &&
      target[0] === currentTurn
    ){

      selectedSquare={
        row:row,
        col:col
      };

      updateSelection();

      setStatus(
        "Pilih kotak tujuan"
      );

    }

    return;
  }


  /* SELECT ANOTHER */

  if(
    target &&
    target[0] === currentTurn
  ){

    selectedSquare={
      row:row,
      col:col
    };

    updateSelection();

    return;
  }


  /* MOVE */

  boardState[row][col] =
    boardState[
      selectedSquare.row
    ][selectedSquare.col];


  boardState[
    selectedSquare.row
  ][selectedSquare.col] =
    null;


  selectedSquare=null;


  currentTurn =
    currentTurn === "w"
      ? "b"
      : "w";


  drawBoard();


  setStatus(
    currentTurn === "w"
      ? "Giliran <strong>Putih</strong>"
      : "Giliran <strong>Hitam</strong>"
  );

}



/* =========================================
   SELECTION
========================================= */

function updateSelection(){

  const squares =
    document.querySelectorAll(
      ".square"
    );


  squares.forEach(
    function(square){

      square.classList.remove(
        "selected",
        "possible",
        "capture"
      );


      if(!selectedSquare){
        return;
      }


      const row =
        Number(
          square.dataset.row
        );

      const col =
        Number(
          square.dataset.col
        );


      if(
        row === selectedSquare.row &&
        col === selectedSquare.col
      ){

        square.classList.add(
          "selected"
        );

        return;
      }


      const target =
        boardState[row][col];


      const distance =
        Math.abs(
          row-selectedSquare.row
        ) +
        Math.abs(
          col-selectedSquare.col
        );


      if(
        !target &&
        distance <= 2
      ){

        square.classList.add(
          "possible"
        );

      }


      if(
        target &&
        target[0] !== currentTurn
      ){

        square.classList.add(
          "capture"
        );

      }

    }
  );

}



/* =========================================
   STATUS
========================================= */

function setStatus(text){

  document.getElementById(
    "status"
  ).innerHTML=text;

}



/* =========================================
   NEW GAME
========================================= */

function newGame(){

  boardState =
    JSON.parse(
      JSON.stringify(initialBoard)
    );

  selectedSquare=null;

  currentTurn="w";

  mySeconds=600;
  enemySeconds=600;

  updateTimer(
    "myTimer",
    mySeconds
  );

  updateTimer(
    "enemyTimer",
    enemySeconds
  );

  drawBoard();

  setStatus(
    "Game baru dimulai — giliran <strong>Putih</strong>"
  );

}



/* =========================================
   FIND OPPONENT
========================================= */

function findOpponent(){

  setStatus(
    "⚔ <strong>Mencari lawan...</strong>"
  );


  setTimeout(
    function(){

      setStatus(
        "Lawan belum tersedia — mode demo aktif"
      );

    },
    1800
  );

}



/* =========================================
   TIMER
========================================= */

let mySeconds=600;

let enemySeconds=600;


setInterval(
  function(){

    if(currentTurn==="w"){

      if(mySeconds>0){
        mySeconds--;
      }

      updateTimer(
        "myTimer",
        mySeconds
      );

    }else{

      if(enemySeconds>0){
        enemySeconds--;
      }

      updateTimer(
        "enemyTimer",
        enemySeconds
      );

    }

  },
  1000
);



function updateTimer(id,seconds){

  const minutes =
    Math.floor(seconds/60);

  const secs =
    seconds%60;


  document.getElementById(id)
    .textContent =
      String(minutes).padStart(2,"0")
      +
      ":"
      +
      String(secs).padStart(2,"0");

}



/* =========================================
   START
========================================= */

drawBoard();

</script>
