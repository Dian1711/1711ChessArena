<!DOCTYPE html>

<meta charset="UTF-8">

<title>1711 Chess Arena</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#151515;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:620px;
  padding:14px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.online{
  padding:6px 10px;
  border-radius:20px;
  background:#252525;
  border:1px solid #414141;
  font-size:11px;
}

/* PLAYER */
.player{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 11px;
  margin-bottom:9px;
  border-radius:12px;
  background:#222;
  border:1px solid #383838;
}

.playerInfo{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  background:#ddd;
  font-size:23px;
}

.name{
  font-size:14px;
  font-weight:800;
}

.rating{
  margin-top:3px;
  color:#999;
  font-size:11px;
}

.timer{
  min-width:78px;
  padding:8px 10px;
  border-radius:8px;
  background:#111;
  border:1px solid #444;
  text-align:center;
  font-size:20px;
  font-weight:900;
}

/* BOARD */
.board{
  width:100%;
  aspect-ratio:1 / 1;

  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));

  border:4px solid #292929;
  background:#292929;

  overflow:hidden;
}

.square{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:0;
  min-height:0;

  border:1px solid #686868;
  overflow:hidden;
}

.light{
  background:#f4f4f4;
}

.dark{
  background:#a5a5a5;
}

/* PIECE */
.piece{
  width:84%;
  height:92%;

  display:flex;
  justify-content:center;
  align-items:center;
}

.piece svg{
  width:100%;
  height:100%;
  display:block;

  overflow:visible;

  filter:
    drop-shadow(2px 3px 2px rgba(0,0,0,.38));
}

/* PROPORSI */
.pawn{
  width:55%;
  height:68%;
}

.rook{
  width:68%;
  height:77%;
}

.knight{
  width:84%;
  height:91%;
}

.bishop{
  width:76%;
  height:89%;
}

.queen{
  width:78%;
  height:91%;
}

.king{
  width:80%;
  height:95%;
}

/* BUTTON */
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

button{
  padding:13px;
  border-radius:10px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.new{
  background:#e0e0e0;
  color:#111;
  border:0;
}

.find{
  background:#303030;
  color:white;
  border:1px solid #505050;
}

.status{
  text-align:center;
  margin-top:10px;
  color:#999;
  font-size:12px;
}

@media(max-width:430px){

  .app{
    padding:10px;
  }

  .logo{
    font-size:18px;
  }

  .pawn{
    width:53%;
    height:65%;
  }

  .rook{
    width:66%;
    height:74%;
  }
}
</style>
</head>
