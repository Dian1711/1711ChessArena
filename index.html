<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>1711 Chess Arena</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #24304d 0%, #0b0e17 48%, #050609 100%);
  color: white;
}

body {
  display: flex;
  justify-content: center;
}

#app {
  width: 100%;
  max-width: 620px;
  height: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 64px;
  flex-shrink: 0;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(8, 11, 20, .88);
  border-bottom: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(12px);
  z-index: 10;
}

.logo {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: .5px;
}

.logo span {
  color: #55d6ff;
}

.online {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #8fffb0;
}

.online-dot {
  width: 7px;
  height: 7px;
  background: #38e67c;
  border-radius: 50%;
  box-shadow: 0 0 10px #38e67c;
}

/* PLAYER */

.player {
  height: 72px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 8px 15px;
  gap: 10px;
  z-index: 5;
}

.player.reverse {
  flex-direction: row-reverse;
}

.avatar {
  width: 54px;
  height: 54px;
  border-radius: 15px;
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,.18);
  box-shadow: 0 7px 20px rgba(0,0,0,.35);
}

.avatar.blue {
  background: linear-gradient(145deg,#36bfff,#124d91);
}

.avatar.red {
  background: linear-gradient(145deg,#ff6868,#851d32);
}

.avatar-head {
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ffd1a8;
  border-radius: 50%;
  left: 50%;
  top: 8px;
  transform: translateX(-50%);
}

.avatar-body {
  position: absolute;
  width: 34px;
  height: 24px;
  border-radius: 15px 15px 7px 7px;
  left: 50%;
  bottom: 5px;
  transform: translateX(-50%);
  background: rgba(255,255,255,.82);
}

.avatar.blue .avatar-body {
  background: #d9f5ff;
}

.avatar.red .avatar-body {
  background: #ffe0e0;
}

.player-info {
  min-width: 0;
}

.player-name {
  font-weight: 800;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-rating {
  font-size: 11px;
  color: #aeb7cb;
  margin-top: 3px;
}

.timer {
  margin-left: auto;
  padding: 8px 12px;
  border-radius: 10px;
  background: #111827;
  border: 1px solid #303a50;
  font-size: 17px;
  font-weight: 900;
  min-width: 68px;
  text-align: center;
}

.reverse .timer {
  margin-left: 0;
  margin-right: auto;
}

/* BOARD */

.board-area {
  width: min(94vw, 540px);
  aspect-ratio: 1 / 1;
  margin: 0 auto;
  position: relative;
  flex-shrink: 0;
}

#board {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 15px;
  overflow: hidden;
  box-shadow:
    0 0 0 3px #1c2538,
    0 18px 50px rgba(0,0,0,.65);
}

/* BUTTONS */

.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  padding: 12px 14px;
  z-index: 10;
}

button {
  border: 0;
  color: white;
  font-weight: 800;
  padding: 12px 18px;
  border-radius: 12px;
  cursor: pointer;
  background: linear-gradient(135deg,#236cff,#6846ff);
  box-shadow: 0 7px 20px rgba(43,93,255,.25);
}

button.secondary {
  background: #171d2b;
  border: 1px solid #313b50;
  box-shadow: none;
}

.status {
  text-align: center;
  font-size: 11px;
  color: #8994aa;
  padding-bottom: 6px;
}

/* MOBILE */

@media (max-height: 700px) {
  .header {
    height: 55px;
  }

  .player {
    height: 57px;
  }

  .avatar {
    width: 43px;
    height: 43px;
  }

  .avatar-head {
    transform: translateX(-50%) scale(.8);
    top: 4px;
  }

  .avatar-body {
    transform: translateX(-50%) scale(.8);
    bottom: 1px;
  }

  .player-name {
    font-size: 12px;
  }

  .timer {
    padding: 6px 9px;
    font-size: 14px;
  }

  .controls {
    padding: 7px;
  }

  button {
    padding: 9px 14px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <div class="logo">♟ <span>1711</span> CHESS ARENA</div>

    <div class="online">
      <div class="online-dot"></div>
      ONLINE
    </div>
  </div>

  <div class="player">
    <div class="avatar red">
      <div class="avatar-head"></div>
      <div class="avatar-body"></div>
    </div>

    <div class="player-info">
      <div class="player-name">Opponent</div>
      <div class="player-rating">Rating 1200</div>
    </div>

    <div class="timer" id="enemyTime">10:00</div>
