<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1711 Chess Arena</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#11151a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    padding:14px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.title{
    font-size:20px;
    font-weight:800;
}

.online{
    font-size:11px;
    padding:5px 9px;
    border-radius:20px;
    background:#19351f;
    color:#70e28a;
    border:1px solid #2d7040;
}

.player{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#1a2027;
    border:1px solid #303740;
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:10px;
}

.player-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#303740;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.player-name{
    font-weight:700;
    font-size:14px;
}

.player-info{
    color:#9da5ae;
    font-size:11px;
    margin-top:3px;
}

.timer{
    min-width:76px;
    text-align:center;
    font-size:18px;
    font-weight:800;
    padding:7px 9px;
    border-radius:8px;
    background:#11151a;
    border:1px solid #3a424b;
}

.timer.active{
    border-color:#d8a23c;
    box-shadow:0 0 10px rgba(216,162,60,.25);
}

.timer.low{
    color:#ff6262;
    border-color:#a93636;
}

.board-wrap{
    width:100%;
    aspect-ratio:1/1;
    background:#20252b;
    padding:5px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.board{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(8,minmax(0,1fr));
    grid-template-rows:repeat(8,minmax(0,1fr));
    overflow:hidden;
    border-radius:8px;
}

.square{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(50,55,60,.28);
    cursor:pointer;
    user-select:none;
}

.square.light{
    background:#f1f1ed;
}

.square.dark{
    background:#a8adb2;
}

.square.selected{
    box-shadow:inset 0 0 0 4px #d8a23c;
}

.square.legal::after{
    content:"";
    position:absolute;
    width:20%;
    height:20%;
    border-radius:50%;
    background:rgba(40,40,40,.35);
}

.square.capture::after{
    content:"";
    position:absolute;
    width:76%;
    height:76%;
    border-radius:50%;
    border:4px solid rgba(180,50,50,.65);
}

.piece{
    width:88%;
    height:88%;
    object-fit:contain;
    position:relative;
    z-index:2;
    pointer-events:none;
}

.pawn{
    width:72%;
    height:72%;
}

.white-piece{
    filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(345deg)
        brightness(1.05)
        contrast(1.05)
        drop-shadow(0 3px 2px rgba(0,0,0,.30))
        drop-shadow(0 5px 4px rgba(0,0,0,.18));
}

.black-piece{
    filter:
        brightness(.10)
        contrast(1.25)
        drop-shadow(0 2px 1px rgba(255,255,255,.08))
        drop-shadow(0 4px 4px rgba(0,0,0,.35));
}

.status{
    margin:12px 0;
    background:#1a2027;
    border:1px solid #303740;
    border-radius:10px;
    padding:11px;
    text-align:center;
    font-size:13px;
    color:#d8dde2;
}

.result{
    display:none;
    text-align:center;
    background:#1a2027;
    border:1px solid #d8a23c;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
}

.result.show{
    display:block;
}

.result-title{
    font-size:24px;
    font-weight:900;
    margin-bottom:6px;
}

.result-text{
    color:#aeb6bf;
    font-size:13px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.new-game{
    background:#d8a23c;
    color:#151515;
}

.lobby{
    background:#292f36;
    color:#fff;
    border:1px solid #414953;
}

@media(max-width:380px){
    .app{
        padding:9px;
    }

    .timer{
        min-width:68px;
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">♟ 1711 Chess Arena</div>
        <div class="online">● ONLINE</div>
    </div>

    <div class="player">
        <div class="player-left">
            <div class="avatar">👤</div>
            <div>
                <div class="player-name">Opponent</div>
                <div class="player-info">1200 • Black</div>
            </div>
        </div>
        <div class="timer" id="blackTimer">10:00</div>
    </div>

    <div class="result" id="resultBox">
        <div class="result-title" id="resultTitle">🏆 Game Over</div>
        <div class="result-text" id="resultText"></div>
    </div>

    <div class="board-wrap">
        <div class="board" id="board"></div>
    </div>

    <div class="status" id="status">
        Giliran kamu — pilih bidak.
    </div>

    <div class="player">
        <div class="player-left">
            <div class="avatar">♟</div>
            <div>
                <div class="player-name">You</div>
                <div class="player-info">1200 • Brown</div>
            </div>
        </div>
        <div class="timer" id="whiteTimer">10:00</div>
    </div>

    <div class="buttons">
        <button class="new-game" onclick="newGame()">⚔️ Game Baru</button>
        <button class="lobby" onclick="goLobby()">🏠 Lobby</button>
    </div>

</div>

<script>
const PIECES = {
    white:{
        rook:"https://sashite.dev/assets/chess/sides/first/representations/western/rook.svg",
        knight:"https://sashite.dev/assets/chess/sides/first/representations/western/knight.svg",
        bishop:"https://sashite.dev/assets/chess/sides/first/representations/western/bishop.svg",
        queen:"https://sashite.dev/assets/chess/sides/first/representations/western/queen.svg",
        king:"https://sashite.dev/assets/chess/sides/first/representations/western/king.svg",
        pawn:"https://sashite.dev/assets/chess/sides/first/representations/western/pawn.svg"
    },
    black:{
        rook:"https://sashite.dev/assets/chess/sides/second/representations/western/rook.svg",
        knight:"https://sashite.dev/assets/chess/sides/second/representations/western/knight.svg",
        bishop:"https://sashite.dev/assets/chess/sides/second/representations/western/bishop.svg",
        queen:"https://sashite.dev/assets/chess/sides/second/representations/western/queen.svg",
        king:"https://sashite.dev/assets/chess/sides/second/representations/western/king.svg",
        pawn:"https://sashite.dev/assets/chess/sides/second/representations/western/pawn.svg"
    }
};

let boardState;
let selected = null;
let turn = "white";
let gameOver = false;

let whiteTime = 600;
let blackTime = 600;
let timerInterval = null;

let castling = {
    whiteKing:true,
    whiteRookKing:true,
    whiteRookQueen:true,
    blackKing:true,
    blackRookKing:true,
    blackRookQueen:true
};

function createInitialBoard(){
    return [
        [
            {type:"rook",color:"black"},
            {type:"knight",color:"black"},
            {type:"bishop",color:"black"},
            {type:"queen",color:"black"},
            {type:"king",color:"black"},
            {type:"bishop",color:"black"},
            {type:"knight",color:"black"},
            {type:"rook",color:"black"}
        ],
        Array(8).fill(null).map(()=>({type:"pawn",color:"black"})),
        Array(8).fill(null),
        Array(8).fill(null),
        Array(8).fill(null),
        Array(8).fill(null),
        Array(8).fill(null).map(()=>({type:"pawn",color:"white"})),
        [
            {type:"rook",color:"white"},
            {type:"knight",color:"white"},
            {type:"bishop",color:"white"},
            {type:"queen",color:"white"},
            {type:"king",color:"white"},
            {type:"bishop",color:"white"},
            {type:"knight",color:"white"},
            {type:"rook",color:"white"}
        ]
    ];
}

function cloneBoard(board){
    return board.map(row =>
        row.map(piece => piece ? {...piece} : null)
    );
}

function inside(r,c){
    return r>=0 && r<8 && c>=0 && c<8;
}

function opposite(color){
    return color==="white" ? "black" : "white";
}

function clearPath(board,fr,fc,tr,tc){
    const dr = Math.sign(tr-fr);
    const dc = Math.sign(tc-fc);

    let r = fr+dr;
    let c = fc+dc;

    while(r!==tr || c!==tc){
        if(board[r][c]) return false;
        r += dr;
        c += dc;
    }

    return true;
}

function isSquareAttackedOnBoard(board,r,c,byColor){

    const pawnRow = byColor==="white" ? r+1 : r-1;

    for(const dc of [-1,1]){
        const pc = c+dc;
        if(inside(pawnRow,pc)){
            const p = board[pawnRow][pc];
            if(p && p.color===byColor && p.type==="pawn"){
                return true;
            }
        }
    }

    const knightMoves = [
        [-2,-1],[-2,1],[-1,-2],[-1,2],
        [1,-2],[1,2],[2,-1],[2,1]
    ];

    for(const [dr,dc] of knightMoves){
        const nr=r+dr;
        const nc=c+dc;

        if(inside(nr,nc)){
            const p=board[nr][nc];

            if(p && p.color===byColor && p.type==="knight"){
                return true;
            }
        }
    }

    for(let dr=-1;dr<=1;dr++){
        for(let dc=-1;dc<=1;dc++){

            if(dr===0 && dc===0) continue;

            const nr=r+dr;
            const nc=c+dc;

            if(inside(nr,nc)){
                const p=board[nr][nc];

                if(p && p.color===byColor && p.type==="king"){
                    return true;
                }
            }
        }
    }

    const diagonal = [
        [-1,-1],[-1,1],[1,-1],[1,1]
    ];

    for(const [dr,dc] of diagonal){

        let nr=r+dr;
        let nc=c+dc;

        while(inside(nr,nc)){

            const p=board[nr][nc];

            if(p){

                if(
                    p.color===byColor &&
                    (p.type==="bishop" || p.type==="queen")
                ){
                    return true;
                }

                break;
            }

            nr+=dr;
            nc+=dc;
        }
    }

    const straight = [
        [-1,0],[1,0],[0,-1],[0,1]
    ];

    for(const [dr,dc] of straight){

        let nr=r+dr;
        let nc=c+dc;

        while(inside(nr,nc)){

            const p=board[nr][nc];

            if(p){

                if(
                    p.color===byColor &&
                    (p.type==="rook" || p.type==="queen")
                ){
                    return true;
                }

                break;
            }

            nr+=dr;
            nc+=dc;
        }
    }

    return false;
}

function findKing(board,color){

    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){

            const p=board[r][c];

            if(
                p &&
                p.color===color &&
                p.type==="king"
            ){
                return [r,c];
            }
        }
    }

    return null;
}

function isKingInCheck(board,color){

    const king=findKing(board,color);

    if(!king) return true;

    return isSquareAttackedOnBoard(
        board,
        king[0],
        king[1],
        opposite(color)
    );
}

function canCastle(board,fr,fc,tr,tc){

    const piece=board[fr][fc];

    if(
        !piece ||
        piece.type!=="king"
    ){
        return false;
    }

    const color=piece.color;

    if(color==="white" && fr===7 && fc===4){

        if(tr!==7) return false;

        if(tc===6){

            if(!castling.whiteKing || !castling.whiteRookKing) return false;

            if(
                !board[7][7] ||
                board[7][7].type!=="rook" ||
                board[7][7].color!=="white"
            ) return false;

            if(board[7][5] || board[7][6]) return false;

            if(isKingInCheck(board,"white")) return false;

            if(isSquareAttackedOnBoard(board,7,5,"black")) return false;
            if(isSquareAttackedOnBoard(board,7,6,"black")) return false;

            return true;
        }

        if(tc===2){

            if(!castling.whiteKing || !castling.whiteRookQueen) return false;

            if(
                !board[7][0] ||
                board[7][0].type!=="rook" ||
                board[7][0].color!=="white"
            ) return false;

            if(board[7][1] || board[7][2] || board[7][3]) return false;

            if(isKingInCheck(board,"white")) return false;

            if(isSquareAttackedOnBoard(board,7,3,"black")) return false;
            if(isSquareAttackedOnBoard(board,7,2,"black")) return false;

            return true;
        }
    }

    if(color==="black" && fr===0 && fc===4){

        if(tr!==0) return false;

        if(tc===6){

            if(!castling.blackKing || !castling.blackRookKing) return false;

            if(
                !board[0][7] ||
                board[0][7].type!=="rook" ||
                board[0][7].color!=="black"
            ) return false;

            if(board[0][5] || board[0][6]) return false;

            if(isKingInCheck(board,"black")) return false;

            if(isSquareAttackedOnBoard(board,0,5,"white")) return false;
            if(isSquareAttackedOnBoard(board,0,6,"white")) return false;

            return true;
        }

        if(tc===2){

            if(!castling.blackKing || !castling.blackRookQueen) return false;

            if(
                !board[0][0] ||
                board[0][0].type!=="rook" ||
                board[0][0].color!=="black"
            ) return false;

            if(board[0][1] || board[0][2] || board[0][3]) return false;

            if(isKingInCheck(board,"black")) return false;

            if(isSquareAttackedOnBoard(board,0,3,"white")) return false;
            if(isSquareAttackedOnBoard(board,0,2,"white")) return false;

            return true;
        }
    }

    return false;
}

function basicMoveValid(board,fr,fc,tr,tc){

    const piece=board[fr][fc];

    if(!piece) return false;

    const target=board[tr][tc];

    if(target && target.color===piece.color){
        return false;
    }

    const dr=tr-fr;
    const dc=tc-fc;

    const adr=Math.abs(dr);
    const adc=Math.abs(dc);

    if(piece.type==="pawn"){

        const dir=piece.color==="white" ? -1 : 1;
        const startRow=piece.color==="white" ? 6 : 1;

        if(dc===0 && !target){

            if(dr===dir) return true;

            if(
                fr===startRow &&
                dr===2*dir &&
                !board[fr+dir][fc]
            ){
                return true;
            }
        }

        if(
            adr===1 &&
            dr===dir &&
            dc!==0 &&
            target &&
            target.color!==piece.color
        ){
            return true;
        }

        return false;
    }

    if(piece.type==="knight"){
        return (
            (adr===2 && adc===1) ||
            (adr===1 && adc===2)
        );
    }

    if(piece.type==="bishop"){
        return (
            adr===adc &&
            adr>0 &&
            clearPath(board,fr,fc,tr,tc)
        );
    }

    if(piece.type==="rook"){
        return (
            ((dr===0 && dc!==0) ||
             (dc===0 && dr!==0)) &&
            clearPath(board,fr,fc,tr,tc)
        );
    }

    if(piece.type==="queen"){
        return (
            (
                (adr===adc && adr>0) ||
                (dr===0 && dc!==0) ||
                (dc===0 && dr!==0)
            ) &&
            clearPath(board,fr,fc,tr,tc)
        );
    }

    if(piece.type==="king"){
        if(adr<=1 && adc<=1 && (adr+adc)>0){
            return true;
        }

        if(
            adr===0 &&
            adc===2 &&
            canCastle(board,fr,fc,tr,tc)
        ){
            return true;
        }
    }

    return false;
}

function makeMoveOnBoard(board,fr,fc,tr,tc){

    const movingPiece=board[fr][fc];

    board[tr][tc]=movingPiece;
    board[fr][fc]=null;

    if(
        movingPiece.type==="king" &&
        Math.abs(tc-fc)===2
    ){

        if(tc===6){

            board[tr][5]=board[tr][7];
            board[tr][7]=null;

        }else if(tc===2){

            board[tr][3]=board[tr][0];
            board[tr][0]=null;
        }
    }

    if(
        movingPiece.type==="pawn" &&
        (tr===0 || tr===7)
    ){
        movingPiece.type="queen";
    }
}

function isLegalMove(fr,fc,tr,tc){

    const piece=boardState[fr][fc];

    if(!piece || piece.color!==turn){
        return false;
    }

    if(!basicMoveValid(boardState,fr,fc,tr,tc)){
        return false;
    }

    const testBoard=cloneBoard(boardState);

    makeMoveOnBoard(testBoard,fr,fc,tr,tc);

    return !isKingInCheck(testBoard,piece.color);
}

function getLegalMoves(r,c){

    const piece=boardState[r][c];

    if(!piece || piece.color!==turn){
        return [];
    }

    const moves=[];

    for(let tr=0;tr<8;tr++){
        for(let tc=0;tc<8;tc++){

            if(isLegalMove(r,c,tr,tc)){
                moves.push([tr,tc]);
            }
        }
    }

    return moves;
}

function hasAnyLegalMove(color){

    const oldTurn=turn;
    turn=color;

    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){

            const piece=boardState[r][c];

            if(
                piece &&
                piece.color===color
            ){

                const moves=getLegalMoves(r,c);

                if(moves.length>0){
                    turn=oldTurn;
                    return true;
                }
            }
        }
    }

    turn=oldTurn;
    return false;
}

function updateCastlingRights(piece,fr,fc,tr,tc,captured){

    if(piece.type==="king"){

        if(piece.color==="white"){
            castling.whiteKing=false;
        }else{
            castling.blackKing=false;
        }
    }

    if(piece.type==="rook"){

        if(piece.color==="white"){

            if(fr===7 && fc===0){
                castling.whiteRookQueen=false;
            }

            if(fr===7 && fc===7){
                castling.whiteRookKing=false;
            }

        }else{

            if(fr===0 && fc===0){
                castling.blackRookQueen=false;
            }

            if(fr===0 && fc===7){
                castling.blackRookKing=false;
            }
        }
    }

    if(
        captured &&
        captured.type==="rook"
    ){

        if(captured.color==="white"){

            if(tr===7 && tc===0){
                castling.whiteRookQueen=false;
            }

            if(tr===7 && tc===7){
                castling.whiteRookKing=false;
            }

        }else{

            if(tr===0 && tc===0){
                castling.blackRookQueen=false;
            }

            if(tr===0 && tc===7){
                castling.blackRookKing=false;
            }
        }
    }
}

function performMove(fr,fc,tr,tc){

    const piece=boardState[fr][fc];

    if(!piece) return;

    const captured=boardState[tr][tc];

    updateCastlingRights(
        piece,
        fr,
        fc,
        tr,
        tc,
        captured
    );

    makeMoveOnBoard(
        boardState,
        fr,
        fc,
        tr,
        tc
    );

    selected=null;

    turn=opposite(turn);

    drawBoard();

    evaluatePosition();

    if(!gameOver){
        updateTimers();
    }
}

function evaluatePosition(){

    const inCheck=isKingInCheck(boardState,turn);
    const hasMoves=hasAnyLegalMove(turn);

    if(!hasMoves){

        gameOver=true;
        stopTimer();

        if(inCheck){

            const winner=opposite(turn);

            if(winner==="white"){
                showResult(
                    "🏆 Kamu Menang!",
                    "Skakmat — King lawan tidak memiliki langkah legal."
                );
            }else{
                showResult(
                    "🏆 Opponent Menang!",
                    "Skakmat — King kamu tidak memiliki langkah legal."
                );
            }

            document.getElementById("status").textContent =
                "♚ SKAKMAT!";

        }else{

            showResult(
                "🤝 Draw",
                "Stalemate — tidak ada langkah legal, tetapi King tidak sedang skak."
            );

            document.getElementById("status").textContent =
                "🤝 STALEMATE — Draw";
        }

        updateTimers();
        return;
    }

    if(inCheck){

        if(turn==="white"){
            document.getElementById("status").textContent =
                "⚠️ Kamu sedang SKAK!";
        }else{
            document.getElementById("status").textContent =
                "⚠️ Opponent sedang SKAK!";
        }

    }else{

        if(turn==="white"){
            document.getElementById("status").textContent =
                "Giliran kamu — pilih bidak.";
        }else{
            document.getElementById("status").textContent =
                "Giliran Opponent.";
        }
    }
}

function showResult(title,text){

    document.getElementById("resultTitle").textContent=title;
    document.getElementById("resultText").textContent=text;

    document.getElementById("resultBox")
        .classList.add("show");
}

function hideResult(){

    document.getElementById("resultBox")
        .classList.remove("show");
}

function drawBoard(){

    const board=document.getElementById("board");

    board.innerHTML="";

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const square=document.createElement("div");

            square.className=
                "square " +
                ((r+c)%2===0 ? "light" : "dark");

            if(
                selected &&
                selected[0]===r &&
                selected[1]===c
            ){
                square.classList.add("selected");
            }

            if(selected){

                const moves=getLegalMoves(
                    selected[0],
                    selected[1]
                );

                const isMove=moves.some(
                    ([mr,mc]) =>
                        mr===r && mc===c
                );

                if(isMove){

                    if(boardState[r][c]){
                        square.classList.add("capture");
                    }else{
                        square.classList.add("legal");
                    }
                }
            }

            const piece=boardState[r][c];

            if(piece){

                const img=document.createElement("img");

                img.className=
                    "piece " +
                    (piece.type==="pawn" ? "pawn " : "") +
                    (piece.color==="white"
                        ? "white-piece"
                        : "black-piece");

                img.src=PIECES[piece.color][piece.type];
                img.alt=piece.type;

                square.appendChild(img);
            }

            square.addEventListener(
                "click",
                ()=>handleSquareClick(r,c)
            );

            board.appendChild(square);
        }
    }
}

function handleSquareClick(r,c){

    if(gameOver) return;

    const piece=boardState[r][c];

    if(selected){

        const [sr,sc]=selected;

        if(isLegalMove(sr,sc,r,c)){

            performMove(
                sr,
                sc,
                r,
                c
            );

            return;
        }

        if(
            piece &&
            piece.color===turn
        ){

            selected=[r,c];
            drawBoard();
            return;
        }

        selected=null;
        drawBoard();
        return;
    }

    if(
        piece &&
        piece.color===turn
    ){

        selected=[r,c];
        drawBoard();
    }
}

function formatTime(seconds){

    const minutes=Math.floor(seconds/60);
    const secs=seconds%60;

    return String(minutes).padStart(2,"0")
        + ":" +
        String(secs).padStart(2,"0");
}

function updateTimers(){

    const whiteTimer=
        document.getElementById("whiteTimer");

    const blackTimer=
        document.getElementById("blackTimer");

    whiteTimer.textContent=
        formatTime(whiteTime);

    blackTimer.textContent=
        formatTime(blackTime);

    whiteTimer.classList.toggle(
        "active",
        turn==="white" && !gameOver
    );

    blackTimer.classList.toggle(
        "active",
        turn==="black" && !gameOver
    );

    whiteTimer.classList.toggle(
        "low",
        whiteTime<=30
    );

    blackTimer.classList.toggle(
        "low",
        blackTime<=30
    );
}

function stopTimer(){

    if(timerInterval!==null){

        clearInterval(timerInterval);
        timerInterval=null;
    }
}

function startTimer(){

    stopTimer();

    timerInterval=setInterval(function(){

        if(gameOver){

            stopTimer();
            return;
        }

        if(turn==="white"){

            if(whiteTime>0){
                whiteTime--;
            }

            if(whiteTime<=0){

                whiteTime=0;
                gameOver=true;

                stopTimer();
                updateTimers();

                showResult(
                    "🏆 Kamu Menang!",
                    "Waktu Opponent habis."
                );

                document.getElementById("status").textContent =
                    "⏱️ Waktu habis — Kamu menang!";

                return;
            }

        }else{

            if(blackTime>0){
                blackTime--;
            }

            if(blackTime<=0){

                blackTime=0;
                gameOver=true;

                stopTimer();
                updateTimers();

                showResult(
                    "🏆 Opponent Menang!",
                    "Waktu kamu habis."
                );

                document.getElementById("status").textContent =
                    "⏱️ Waktu habis — Opponent menang!";

                return;
            }
        }

        updateTimers();

    },1000);
}

function newGame(){

    stopTimer();

    boardState=createInitialBoard();

    selected=null;
    turn="white";
    gameOver=false;

    whiteTime=600;
    blackTime=600;

    castling={
        whiteKing:true,
        whiteRookKing:true,
        whiteRookQueen:true,
        blackKing:true,
        blackRookKing:true,
        blackRookQueen:true
    };

    hideResult();

    document.getElementById("status").textContent =
        "Giliran kamu — pilih bidak.";

    updateTimers();
    drawBoard();

    startTimer();
}

function goLobby(){

    alert("Lobby akan kita buat pada tahap multiplayer.");
}

newGame();
