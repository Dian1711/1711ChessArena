<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>1711 Chess Arena</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#151515;
  color:white;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  padding:14px;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:20px;
  background:#252525;
  font-size:11px;
  color:#bbb;
}

.online-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#54c76a;
}

/* PLAYER */
.player{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  margin-bottom:9px;
  border-radius:13px;
  background:#222;
  border:1px solid #363636;
}

.player-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  background:#ddd;
  border:2px solid #555;
}

.player-name{
  font-size:14px;
  font-weight:800;
}

.rating{
  margin-top:3px;
  color:#999;
  font-size:11px;
}

.timer{
  min-width:78px;
  text-align:center;
  padding:8px 10px;
  border-radius:9px;
  background:#111;
  border:1px solid #444;
  font-size:21px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

/* BOARD */
.board-wrap{
  width:100%;
  max-width:590px;
  margin:8px auto;
}

.board{
  width:100%;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  border:5px solid #292929;
  background:#292929;
  overflow:hidden;
}

.square{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:0;
  border:1px solid rgba(70,70,70,.42);
  overflow:hidden;
}

.square.light{
  background:#f3f3f3;
}

.square.dark{
  background:#a7a7a7;
}

.square.selected{
  box-shadow:inset 0 0 0 4px #d69a35;
}

.square.move{
  box-shadow:inset 0 0 0 3px rgba(35,120,70,.7);
}

/* PIECE HOLDER */
.piece{
  width:82%;
  height:88%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:2;
}

/* PROPORSI PER JENIS */
.piece.pawn{
  width:56%;
  height:67%;
}

.piece.rook{
  width:68%;
  height:77%;
}

.piece.knight{
  width:82%;
  height:89%;
}

.piece.bishop{
  width:76%;
  height:88%;
}

.piece.queen{
  width:79%;
  height:91%;
}

.piece.king{
  width:80%;
  height:94%;
}

.piece svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
  filter:drop-shadow(1px 2px 1px rgba(0,0,0,.35));
}

/* actual silhouette scaling */
.piece.pawn svg{
  width:78%;
  height:78%;
}

.piece.rook svg{
  width:84%;
  height:84%;
}

/* BUTTONS */
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

button{
  border:0;
  border-radius:11px;
  padding:13px 10px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.new{
  background:#e0e0e0;
  color:#151515;
}

.find{
  background:#303030;
  color:white;
  border:1px solid #505050;
}

.status{
  text-align:center;
  margin-top:10px;
  color:#999;
  font-size:12px;
}

/* MOBILE */
@media(max-width:430px){
  .app{
    padding:10px;
  }

  .logo{
    font-size:18px;
  }

  .player{
    padding:8px 9px;
  }

  .avatar{
    width:38px;
    height:38px;
    font-size:21px;
  }

  .timer{
    min-width:70px;
    font-size:18px;
  }

  .board{
    border-width:3px;
  }

  .piece.pawn svg{
    width:75%;
    height:75%;
  }

  .piece.rook svg{
    width:80%;
    height:80%;
  }
}
</style>
</head>

  </linearGradient>

/* =========================================================
   SVG BUILDER
   ========================================================= */

function svg(content,color){

  const fill = color === "white"
    ? "url(#brown)"
    : "url(#black)";

  const edge = color === "white"
    ? "url(#edgeBrown)"
    : "url(#edgeBlack)";

  return `
  <svg viewBox="0 0 100 120"
       xmlns="http://www.w3.org/2000/svg">

    ${defs}

    <g stroke="${color === "white" ? "#70451f" : "#050505"}"
       stroke-width="1.3"
       stroke-linejoin="round">

      ${content(fill,edge)}

    </g>
  </svg>
  `;
}
