<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>1711 Chess Arena</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080b12;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: auto;
    padding: 12px;
    background:
        radial-gradient(circle at 50% 30%, #182033 0%, #080b12 55%);
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .5px;
}

.logo span {
    color: #d8a84e;
}

.status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #9ca6b8;
}

.online {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #48d597;
    box-shadow: 0 0 8px #48d597;
}

/* PLAYER */

.player {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
}

.player-left {
    display: flex;
    align-items: center;
    gap: 9px;
}

.character {
    position: relative;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
}

.character .head {
    position: absolute;
    width: 24px;
    height: 24px;
    left: 12px;
    top: 3px;
    border-radius: 50%;
    background: #d89b6b;
    z-index: 3;
}

.character .hair {
    position: absolute;
    width: 26px;
    height: 14px;
    left: 11px;
    top: 1px;
    border-radius: 15px 15px 5px 5px;
    background: #20252f;
    z-index: 4;
}

.character .body {
    position: absolute;
    width: 36px;
    height: 24px;
    left: 6px;
    top: 24px;
    border-radius: 12px 12px 7px 7px;
    background: #4d73a8;
}

.character .armor {
    position: absolute;
    width: 28px;
    height: 17px;
    left: 10px;
    top: 25px;
    border-radius: 7px;
    background: #d8a84e;
    opacity: .9;
}

.character.enemy .body {
    background: #713f52;
}

.character.enemy .armor {
    background: #a85b64;
}

.player-name {
    font-size: 14px;
    font-weight: 800;
}

.rating {
    font-size: 10px;
    color: #858ea0;
    margin-top: 2px;
}

.timer {
    min-width: 78px;
    padding: 9px 12px;
    border-radius: 9px;
    background: #161c29;
    border: 1px solid #30394b;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
}

.timer.active {
    border-color: #d8a84e;
    color: #f1c866;
}

/* BOARD */

.board-wrap {
    width: 100%;
    padding: 5px;
    margin: 5px auto 8px;
    border-radius: 12px;
    background: linear-gradient(145deg, #3b3020, #15120d);
    box-shadow:
        0 15px 35px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.board {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border-radius: 7px;
    overflow: hidden;
    transform: perspective(700px) rotateX(1deg);
}

.square {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    cursor: pointer;
}

.square.light {
    background: linear-gradient(145deg, #d7c49a, #bba878);
}

.square.dark {
    background: linear-gradient(145deg, #705b42, #4d3d2d);
}

.square.selected {
    box-shadow: inset 0 0 0 4px #e5b64f;
}

.square.possible::after {
    content: "";
    position: absolute;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: rgba(30,30,30,.35);
}

.piece {
    position: relative;
    z-index: 2;
    font-family: "Times New Roman", serif;
    font-size: clamp(29px, 9vw, 53px);
    line-height: 1;
    cursor: pointer;
    transform: translateY(-2px);
    filter: drop-shadow(2px 4px 2px rgba(0,0,0,.45));
}

.white-piece {
    color: #f5f0df;
    text-shadow:
        0 2px 0 #b4a98d,
        1px 3px 3px #222;
}

.black-piece {
    color: #20242c;
    text-shadow:
        0 1px 0 #555,
        2px 4px 4px #111;
}

/* COORDINATES */

.coord {
    position: absolute;
    font-size: 7px;
    font-weight: bold;
    opacity: .6;
    pointer-events: none;
}

.coord.file {
    bottom: 2px;
    right: 3px;
}

.coord.rank {
    top: 2px;
    left: 3px;
}

/* INFO */

.turn {
    text-align: center;
    font-size: 11px;
    color: #9da7b9;
    margin: 6px 0 10px;
}

.turn strong {
    color: #e5b64f;
}

/* BUTTONS */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

button {
    min-height: 45px;
    border: 0;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

.primary {
    background: linear-gradient(135deg, #e2b451, #a97a28);
    color: #17120a;
}

.secondary {
    background: #161c29;
    border: 1px solid #30394b;
    color: #e5e9f0;
}

button:active {
    transform: scale(.97);
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 10px;
    font-size: 9px;
    color: #5f6878;
}

/* MOBILE */

@media (max-width: 360px) {
    .app {
        padding: 8px;
    }

    .timer {
        min-width: 68px;
        font-size: 16px;
    }

    .player-name {
        font-size: 12px;
    }

    .rating {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">♞ <span>1711</span> Chess Arena</div>

        <div class="status">
            <div class="online"></div>
            ONLINE
        </div>
    </div>

    <!-- OPPONENT -->

    <div class="player">

        <div class="player-left">

            <div class="character enemy">
                <div class="head"></div>
                <div class="hair"></div>
                <div class="body"></div>
                <div class="armor"></div>
            </div>

            <div>
                <div class="player-name">Opponent</div>
                <div class="rating">♟ Rating 1200</div>
            </div>

        </div>

        <div class="timer" id="enemyTimer">
            09:59
        </div>

    </div>

    <!-- CHESS BOARD -->

    <div class="board-wrap">
        <div class="board" id="board"></div>
    </div>

    <div class="turn">
        Giliran: <strong id="turnText">White</strong>
    </div>

    <!-- PLAYER -->

    <div class="player">

        <div class="player-left">

            <div class="character">
                <div class="head"></div>
                <div class="hair"></div>
                <div class="body"></div>
                <div class="armor"></div>
            </div>

            <div>
                <div class="player-name">You</div>
                <div class="rating">♟ Rating 1200</div>
            </div>

        </div>

        <div class="timer active" id="playerTimer">
            10:00
        </div>

    </div>

    <div class="actions">
        <button class="primary" id="newGame">♟ Game Baru</button>
        <button class="secondary" id="findOpponent">⚔ Cari Lawan</button>
    </div>

    <div class="footer">
        1711 Chess Arena • 3D Top View
    </div>

</div>

<script>

const boardElement = document.getElementById("board");
const turnText = document.getElementById("turnText");
const playerTimer = document.getElementById("playerTimer");
const enemyTimer = document.getElementById("enemyTimer");

const files = ["a","b","c","d","e","f","g","h"];

const startPosition = [
    ["♜","♞","♝","♛","♚","♝","♞","♜"],
    ["♟","♟","♟","♟","♟","♟","♟","♟"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["♙","♙","♙","♙","♙","♙","♙","♙"],
    ["♖","♘","♗","♕","♔","♗","♘","♖"]
];

let position = JSON.parse(JSON.stringify(startPosition));
let selected = null;
let whiteTurn = true;

function isWhite(piece) {
    return "♙♖♘♗♕♔".includes(piece);
}

function isBlack(piece) {
    return "♟♜♞♝♛♚".includes(piece);
}

function renderBoard() {

    boardElement.innerHTML = "";

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square = document.createElement("div");

            square.className =
                "square " +
                ((row + col) % 2 === 0 ? "light" : "dark");

            const piece = position[row][col];

            if (piece) {

                const pieceElement = document.createElement("div");

                pieceElement.className =
                    "piece " +
                    (isWhite(piece)
                        ? "white-piece"
                        : "black-piece");

                pieceElement.textContent = piece;

                square.appendChild(pieceElement);
            }

            /* coordinates */

            if (row === 7) {

                const file = document.createElement("span");

                file.className = "coord file";
                file.textContent = files[col];

                square.appendChild(file);
            }

            if (col === 0) {

                const rank = document.createElement("span");

                rank.className = "coord rank";
                rank.textContent = 8 - row;

                square.appendChild(rank);
            }

            square.dataset.row = row;
            square.dataset.col = col;

            if (
                selected &&
                selected.row === row &&
                selected.col === col
            ) {
                square.classList.add("selected");
            }

            square.addEventListener("click", handleSquareClick);

            boardElement.appendChild(square);
        }
    }
}

function handleSquareClick(e) {

    const square = e.currentTarget;

    const row = Number(square.dataset.row);
    const col = Number(square.dataset.col);

    const piece = position[row][col];

    /* select piece */

    if (!selected) {

        if (!piece) return;

        if (whiteTurn && !isWhite(piece)) return;
        if (!whiteTurn && !isBlack(piece)) return;

        selected = { row, col };

        renderBoard();

        return;
    }

    /* click same square */

    if (
        selected.row === row &&
        selected.col === col
    ) {

        selected = null;
        renderBoard();

        return;
    }

    /* move */

    position[row][col] =
        position[selected.row][selected.col];

    position[selected.row][selected.col] = "";

    selected = null;

    whiteTurn = !whiteTurn;

    turnText.textContent =
        whiteTurn ? "White" : "Black";

    if (whiteTurn) {

        playerTimer.classList.add("active");
        enemyTimer.classList.remove("active");

    } else {

        playerTimer.classList.remove("active");
        enemyTimer.classList.add("active");
    }

    renderBoard();
}


/* TIMER */

let whiteSeconds = 600;
let blackSeconds = 599;

function formatTime(seconds) {

    seconds = Math.max(0, seconds);

    const min =
        Math.floor(seconds / 60)
        .toString()
        .padStart(2,"0");

    const sec =
        (seconds % 60)
        .toString()
        .padStart(2,"0");

    return min + ":" + sec;
}

setInterval(() => {

    if (whiteTurn) {

        whiteSeconds--;

        playerTimer.textContent =
            formatTime(whiteSeconds);

    } else {

        blackSeconds--;

        enemyTimer.textContent =
            formatTime(blackSeconds);
    }

},1000);


/* NEW GAME */

document.getElementById("newGame")
.addEventListener("click", () => {

    position =
        JSON.parse(JSON.stringify(startPosition));

    selected = null;
    whiteTurn = true;

    whiteSeconds = 600;
    blackSeconds = 599;

    playerTimer.textContent =
        formatTime(whiteSeconds);

    enemyTimer.textContent =
        formatTime(blackSeconds);

    playerTimer.classList.add("active");
    enemyTimer.classList.remove("active");

    turnText.textContent = "White";

    renderBoard();
});


/* FIND OPPONENT */

document.getElementById("findOpponent")
.addEventListener("click", function() {

    this.textContent = "🔎 Mencari...";

    setTimeout(() => {

        this.textContent = "⚔ Lawan ditemukan";

        setTimeout(() => {
            this.textContent = "⚔ Cari Lawan";
        },1500);

    },1200);
});


renderBoard();

</script>

</body>
</html>
