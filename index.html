<title>1711 Chess Arena</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#151515;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  padding:14px;
}

.app{
  width:min(100%,520px);
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:.4px;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:#aaa;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#42d66b;
}

/* PLAYER */

.player{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  background:#222;
  border:1px solid #3a3a3a;
  border-radius:12px;
  margin-bottom:10px;
}

.player-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#555;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.name{
  font-weight:700;
  font-size:14px;
}

.rating{
  margin-top:3px;
  color:#999;
  font-size:11px;
}

.time{
  font-size:23px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

/* BOARD */

.board-wrap{
  width:100%;
  aspect-ratio:1/1;
  padding:5px;
  background:#333;
  border-radius:10px;
  box-shadow:
    0 10px 30px rgba(0,0,0,.45),
    inset 0 0 0 1px #555;
}

.board{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  border:2px solid #555;
}

/* EVERY SQUARE IS IDENTICAL */

.square{
  min-width:0;
  min-height:0;
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #666;
  overflow:hidden;
}

.light{
  background:#eeeeee;
}

.dark{
  background:#9d9d9d;
}

/* PIECES */

.piece{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.piece svg{
  display:block;
  width:78%;
  height:90%;
  overflow:visible;
}

/* INDIVIDUAL PROPORTIONS */

.pawn svg{
  width:62%;
  height:70%;
}

.rook svg{
  width:69%;
  height:78%;
}

.knight svg{
  width:78%;
  height:88%;
}

.bishop svg{
  width:70%;
  height:86%;
}

.queen svg{
  width:72%;
  height:88%;
}

.king svg{
  width:74%;
  height:91%;
}

/* COLORS */

.brown{
  color:#b97b46;
}

.black{
  color:#171717;
}

/* subtle shadows under pieces */

.brown svg,
.black svg{
  filter:drop-shadow(1px 2px 1px rgba(0,0,0,.32));
}

/* BUTTONS */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 10px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.new-game{
  background:#eeeeee;
  color:#111;
}

.find{
  background:#b97b46;
  color:#fff;
}

/* FOOTER */

.status{
  text-align:center;
  color:#888;
  font-size:11px;
  margin-top:10px;
}

/* MOBILE */

@media(max-width:380px){

  body{
    padding:8px;
  }

  .player{
    padding:8px;
  }

  .avatar{
    width:36px;
    height:36px;
  }

  .time{
    font-size:19px;
  }

}
</style>
