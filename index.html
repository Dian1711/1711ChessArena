<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1711 Chess Arena</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #252a2f 0%, #111416 55%, #080909 100%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 18px 10px;
}

.game {
    width: 100%;
    max-width: 520px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.online {
    font-size: 11px;
    background: #183b24;
    color: #62e28a;
    border: 1px solid #28643b;
    padding: 5px 9px;
    border-radius: 20px;
}

.player {
    background: #191d20;
    border: 1px solid #30363a;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.player-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #30363a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.player-name {
    font-weight: bold;
    font-size: 14px;
}

.rating {
    color: #90979c;
    font-size: 11px;
    margin-top: 3px;
}

.timer {
    background: #0c0e0f;
    border: 1px solid #343a3f;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 17px;
    font-weight: bold;
    min-width: 70px;
    text-align: center;
}

.timer.active {
    border-color: #d8a23c;
    box-shadow: 0 0 10px rgba(216,162,60,.25);
}

.timer.low {
    color: #ff6262;
    border-color: #a93636;
}

/* BOARD */

.board-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #17191b;
    border: 5px solid #17191b;
    border-radius: 7px;
    box-shadow:
        0 12px 35px rgba(0,0,0,.5),
        0 0 0 1px #35393c;
}

.board {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    overflow: hidden;
    border-radius: 2px;
}

.square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1px solid rgba(50,55,60,.28);
}

.square.light {
    background: #f1f1ed;
}

.square.dark {
    background: #a8adb2;
}

.square.selected {
    box-shadow: inset 0 0 0 4px rgba(255, 193, 7, .9);
}

.square.move::after {
    content: "";
    width: 24%;
    height: 24%;
    border-radius: 50%;
    background: rgba(30, 35, 40, .35);
    position: absolute;
}

.square.capture {
    box-shadow: inset 0 0 0 5px rgba(180, 40, 40, .65);
}

.square.king-check {
    box-shadow: inset 0 0 0 5px rgba(220, 45, 45, .9);
}

.square.castle-move::after {
    content: "";
    width: 24%;
    height: 24%;
    border-radius: 50%;
    background: rgba(50, 100, 180, .55);
    position: absolute;
}

/* PIECES */

.piece {
    width: 88%;
    height: 88%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
}

.white-piece {
    filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(345deg)
        brightness(1.05)
        contrast(1.05)
        drop-shadow(0 3px 2px rgba(0,0,0,.30))
        drop-shadow(0 5px 4px rgba(0,0,0,.18));
}

.black-piece {
    filter:
        brightness(.10)
        contrast(1.25)
        drop-shadow(0 2px 1px rgba(255,255,255,.08))
        drop-shadow(0 4px 4px rgba(0,0,0,.35));
}

.pawn {
    width: 72%;
    height: 72%;
}

.status {
    text-align: center;
    color: #9ca3a7;
    font-size: 12px;
    margin: 12px 0;
    min-height: 16px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.find {
    background: #d8a23c;
    color: #151515;
}

.lobby {
    background: #292e32;
    color: white;
    border: 1px solid #3d4449;
}

button:active {
    transform: scale(.98);
}

@media (max-width: 380px) {

    body {
        padding: 12px 7px;
    }

    .logo {
        font-size: 18px;
    }

    .timer {
        font-size: 15px;
        min-width: 64px;
    }

    .player {
        padding: 8px 10px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <div class="logo">♟ 1711 Chess Arena</div>
        <div class="online">● ONLINE</div>
    </div>

    <!-- OPPONENT -->

    <div class="player">

        <div class="player-left">

            <div class="avatar">👤</div>

            <div>
                <div class="player-name">Opponent</div>
                <div class="rating">1200 • Black</div>
            </div>

        </div>

        <div class="timer" id="blackTimer">10:00</div>

    </div>


    <!-- BOARD -->

    <div class="board-wrap">
        <div class="board" id="board"></div>
    </div>


    <!-- YOU -->

    <div class="player" style="margin-top:10px;">

        <div class="player-left">

            <div class="avatar">♟</div>

            <div>
                <div class="player-name">You</div>
                <div class="rating">1200 • Brown</div>
            </div>

        </div>

        <div class="timer" id="whiteTimer">10:00</div>

    </div>


    <div class="status" id="status">
        Giliran kamu — pilih bidak.
    </div>


    <div class="buttons">
        <button class="find" onclick="newGame()">⚔️ Game Baru</button>
        <button class="lobby">🏠 Lobby</button>
    </div>

</div>


<script>

/* =====================================================
   CHESS IMAGE ASSETS
===================================================== */

const pieces = {

    white: {
        king:
        "https://sashite.dev/assets/chess/sides/first/representations/western/king.svg",

        queen:
        "https://sashite.dev/assets/chess/sides/first/representations/western/queen.svg",

        rook:
        "https://sashite.dev/assets/chess/sides/first/representations/western/rook.svg",

        bishop:
        "https://sashite.dev/assets/chess/sides/first/representations/western/bishop.svg",

        knight:
        "https://sashite.dev/assets/chess/sides/first/representations/western/knight.svg",

        pawn:
        "https://sashite.dev/assets/chess/sides/first/representations/western/pawn.svg"
    },

    black: {
        king:
        "https://sashite.dev/assets/chess/sides/second/representations/western/king.svg",

        queen:
        "https://sashite.dev/assets/chess/sides/second/representations/western/queen.svg",

        rook:
        "https://sashite.dev/assets/chess/sides/second/representations/western/rook.svg",

        bishop:
        "https://sashite.dev/assets/chess/sides/second/representations/western/bishop.svg",

        knight:
        "https://sashite.dev/assets/chess/sides/second/representations/western/knight.svg",

        pawn:
        "https://sashite.dev/assets/chess/sides/second/representations/western/pawn.svg"
    }

};


/* =====================================================
   BOARD
===================================================== */

let boardState;

let turn = "white";

let selected = null;

let gameOver = false;


/* =====================================================
   CASTLING RIGHTS
===================================================== */

let castling = {
    whiteKing: true,
    whiteRookKing: true,
    whiteRookQueen: true,

    blackKing: true,
    blackRookKing: true,
    blackRookQueen: true
};


/* =====================================================
   TIMER
===================================================== */

let whiteTime = 600;
let blackTime = 600;

let timerInterval = null;


/* =====================================================
   CREATE START POSITION
===================================================== */

function createInitialBoard() {

    return [

        [
            {type:"rook", color:"black"},
            {type:"knight", color:"black"},
            {type:"bishop", color:"black"},
            {type:"queen", color:"black"},
            {type:"king", color:"black"},
            {type:"bishop", color:"black"},
            {type:"knight", color:"black"},
            {type:"rook", color:"black"}
        ],

        [
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"}
        ],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        [
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"}
        ],

        [
            {type:"rook", color:"white"},
            {type:"knight", color:"white"},
            {type:"bishop", color:"white"},
            {type:"queen", color:"white"},
            {type:"king", color:"white"},
            {type:"bishop", color:"white"},
            {type:"knight", color:"white"},
            {type:"rook", color:"white"}
        ]

    ];

}


/* =====================================================
   DRAW BOARD
===================================================== */

function drawBoard() {

    const board = document.getElementById("board");

    board.innerHTML = "";


    for(let row = 0; row < 8; row++) {

        for(let col = 0; col < 8; col++) {

            const square = document.createElement("div");

            square.className =
                ((row + col) % 2 === 0)
                ? "square light"
                : "square dark";


            square.dataset.row = row;
            square.dataset.col = col;


            square.addEventListener("click", function() {

                handleSquareClick(row, col);

            });


            const piece = boardState[row][col];


            if(piece) {

                const img = document.createElement("img");

                img.className = "piece";

                if(piece.type === "pawn") {
                    img.classList.add("pawn");
                }

                img.classList.add(
                    piece.color === "white"
                    ? "white-piece"
                    : "black-piece"
                );

                img.src = pieces[piece.color][piece.type];

                square.appendChild(img);

            }


            board.appendChild(square);

        }

    }


    highlightBoard();

}


/* =====================================================
   CLICK
===================================================== */

function handleSquareClick(row, col) {

    if(gameOver) return;


    const piece = boardState[row][col];


    if(!selected) {

        if(!piece) return;


        if(piece.color !== turn) {

            document.getElementById("status").textContent =
                turn === "white"
                ? "Sekarang giliran kamu."
                : "Sekarang giliran Opponent.";

            return;
        }


        selected = {
            row,
            col
        };


        drawBoard();

        return;
    }


    if(
        selected.row === row &&
        selected.col === col
    ) {

        selected = null;

        drawBoard();

        return;
    }


    if(
        piece &&
        piece.color === turn
    ) {

        selected = {
            row,
            col
        };

        drawBoard();

        return;
    }


    if(
        isLegalMove(
            selected.row,
            selected.col,
            row,
            col
        )
    ) {

        movePiece(
            selected.row,
            selected.col,
            row,
            col
        );

    }

}


/* =====================================================
   MAKE MOVE
===================================================== */

function movePiece(fr, fc, tr, tc) {

    const movingPiece = boardState[fr][fc];

    const capturedPiece = boardState[tr][tc];


    /* UPDATE CASTLING RIGHTS */

    updateCastlingRights(
        movingPiece,
        fr,
        fc,
        tr,
        tc,
        capturedPiece
    );


    /* CASTLING */

    if(
        movingPiece.type === "king" &&
        Math.abs(tc - fc) === 2
    ) {

        boardState[tr][tc] = movingPiece;
        boardState[fr][fc] = null;


        /* KING SIDE */

        if(tc === 6) {

            const rook = boardState[tr][7];

            boardState[tr][5] = rook;
            boardState[tr][7] = null;

        }


        /* QUEEN SIDE */

        if(tc === 2) {

            const rook = boardState[tr][0];

            boardState[tr][3] = rook;
            boardState[tr][0] = null;

        }

    }

    else {

        boardState[tr][tc] = movingPiece;
        boardState[fr][fc] = null;

    }


    /* PROMOTION */

    if(
        movingPiece.type === "pawn" &&
        (tr === 0 || tr === 7)
    ) {

        movingPiece.type = "queen";

    }


    selected = null;


    /* SWITCH TURN */

    turn =
        turn === "white"
        ? "black"
        : "white";


    evaluatePosition();


    drawBoard();

}


/* =====================================================
   UPDATE CASTLING RIGHTS
===================================================== */

function updateCastlingRights(
    piece,
    fr,
    fc,
    tr,
    tc,
    captured
) {

    if(piece.type === "king") {

        if(piece.color === "white") {
            castling.whiteKing = false;
        } else {
            castling.blackKing = false;
        }

    }


    if(piece.type === "rook") {

        if(piece.color === "white") {

            if(fr === 7 && fc === 0)
                castling.whiteRookQueen = false;

            if(fr === 7 && fc === 7)
                castling.whiteRookKing = false;

        }

        else {

            if(fr === 0 && fc === 0)
                castling.blackRookQueen = false;

            if(fr === 0 && fc === 7)
                castling.blackRookKing = false;

        }

    }


    /* CAPTURED ROOK */

    if(
        captured &&
        captured.type === "rook"
    ) {

        if(captured.color === "white") {

            if(tr === 7 && tc === 0)
                castling.whiteRookQueen = false;

            if(tr === 7 && tc === 7)
                castling.whiteRookKing = false;

        }

        else {

            if(tr === 0 && tc === 0)
                castling.blackRookQueen = false;

            if(tr === 0 && tc === 7)
                castling.blackRookKing = false;

        }

    }

}


/* =====================================================
   LEGAL MOVE
===================================================== */

function isLegalMove(fr, fc, tr, tc) {

    const piece = boardState[fr][fc];

    if(!piece) return false;


    const target = boardState[tr][tc];


    if(
        target &&
        target.color === piece.color
    ) {

        return false;

    }


    /* KING */

    if(piece.type === "king") {

        const normalKingMove =
            Math.abs(tr - fr) <= 1 &&
            Math.abs(tc - fc) <= 1;


        if(normalKingMove) {

            if(
                isSquareAttacked(
                    tr,
                    tc,
                    opposite(piece.color)
                )
            ) {
                return false;
            }


            const testBoard = cloneBoard(boardState);

            testBoard[tr][tc] = testBoard[fr][fc];
            testBoard[fr][fc] = null;


            if(
                isKingInCheckOnBoard(
                    testBoard,
                    piece.color
                )
            ) {
                return false;
            }


            return true;

        }


        /* CASTLING */

        if(
            Math.abs(tc - fc) === 2 &&
            tr === fr
        ) {

            return canCastle(
                piece.color,
                fr,
                fc,
                tc
            );

        }


        return false;

    }


    /* NORMAL PIECE MOVES */

    if(!basicMovementIsValid(
        boardState,
        piece,
        fr,
        fc,
        tr,
        tc
    )) {

        return false;

    }


    /* TEST MOVE */

    const testBoard = cloneBoard(boardState);

    testBoard[tr][tc] = testBoard[fr][fc];
    testBoard[fr][fc] = null;


    if(
        isKingInCheckOnBoard(
            testBoard,
            piece.color
        )
    ) {

        return false;

    }


    return true;

}


/* =====================================================
   BASIC MOVEMENT
===================================================== */

function basicMovementIsValid(
    board,
    piece,
    fr,
    fc,
    tr,
    tc
) {

    const dr = tr - fr;
    const dc = tc - fc;

    const adr = Math.abs(dr);
    const adc = Math.abs(dc);


    /* PAWN */

    if(piece.type === "pawn") {

        const direction =
            piece.color === "white"
            ? -1
            : 1;


        const startRow =
            piece.color === "white"
            ? 6
            : 1;


        if(
            dc === 0 &&
            !board[tr][tc]
        ) {

            if(dr === direction)
                return true;


            if(
                fr === startRow &&
                dr === direction * 2 &&
                !board[fr + direction][fc]
            ) {
                return true;
            }

        }


        if(
            Math.abs(dc) === 1 &&
            dr === direction &&
            board[tr][tc] &&
            board[tr][tc].color !== piece.color
        ) {

            return true;

        }


        return false;

    }


    /* KNIGHT */

    if(piece.type === "knight") {

        return (
            (adr === 2 && adc === 1) ||
            (adr === 1 && adc === 2)
        );

    }


    /* BISHOP */

    if(piece.type === "bishop") {

        if(adr !== adc)
            return false;

        return clearPathOnBoard(
            board,
            fr,
            fc,
            tr,
            tc
        );

    }


    /* ROOK */

    if(piece.type === "rook") {

        if(fr !== tr && fc !== tc)
            return false;

        return clearPathOnBoard(
            board,
            fr,
            fc,
            tr,
            tc
        );

    }


    /* QUEEN */

    if(piece.type === "queen") {

        if(
            fr === tr ||
            fc === tc ||
            adr === adc
        ) {

            return clearPathOnBoard(
                board,
                fr,
                fc,
                tr,
                tc
            );

        }

        return false;

    }


    return false;

}


/* =====================================================
   PATH
===================================================== */

function clearPathOnBoard(
    board,
    fr,
    fc,
    tr,
    tc
) {

    const stepR = Math.sign(tr - fr);
    const stepC = Math.sign(tc - fc);


    let r = fr + stepR;
    let c = fc + stepC;


    while(
        r !== tr ||
        c !== tc
    ) {

        if(board[r][c]) {
            return false;
        }


        r += stepR;
        c += stepC;

    }


    return true;

}


/* =====================================================
   CASTLING
===================================================== */

function canCastle(
    color,
    row,
    kingCol,
    targetCol
) {

    if(
        isKingInCheckOnBoard(
            boardState,
            color
        )
    ) {
        return false;
    }


    const enemy = opposite(color);


    /* KING SIDE */

    if(targetCol === 6) {

        if(
            color === "white" &&
            !castling.whiteKing
        ) return false;

        if(
            color === "white" &&
            !castling.whiteRookKing
        ) return false;


        if(
            color === "black" &&
            !castling.blackKing
        ) return false;

        if(
            color === "black" &&
            !castling.blackRookKing
        ) return false;


        const rook = boardState[row][7];


        if(
            !rook ||
            rook.type !== "rook" ||
            rook.color !== color
        ) {
            return false;
        }


        if(
            boardState[row][5] ||
            boardState[row][6]
        ) {
            return false;
        }


        if(
            isSquareAttacked(row,5,enemy) ||
            isSquareAttacked(row,6,enemy)
        ) {
            return false;
        }


        return true;

    }


    /* QUEEN SIDE */

    if(targetCol === 2) {

        if(
            color === "white" &&
            !castling.whiteKing
        ) return false;

        if(
            color === "white" &&
            !castling.whiteRookQueen
        ) return false;


        if(
            color === "black" &&
            !castling.blackKing
        ) return false;

        if(
            color === "black" &&
            !castling.blackRookQueen
        ) return false;


        const rook = boardState[row][0];


        if(
            !rook ||
            rook.type !== "rook" ||
            rook.color !== color
        ) {
            return false;
        }


        if(
            boardState[row][1] ||
            boardState[row][2] ||
            boardState[row][3]
        ) {
            return false;
        }


        if(
            isSquareAttacked(row,3,enemy) ||
            isSquareAttacked(row,2,enemy)
        ) {
            return false;
        }


        return true;

    }


    return false;

}


/* =====================================================
   ATTACK DETECTION
===================================================== */

function isSquareAttacked(
    row,
    col,
    byColor
) {

    return isSquareAttackedOnBoard(
        boardState,
        row,
        col,
        byColor
    );

}


function isSquareAttackedOnBoard(
    board,
    row,
    col,
    byColor
) {

    for(let r = 0; r < 8; r++) {

        for(let c = 0; c < 8; c++) {

            const piece = board[r][c];

            if(
                !piece ||
                piece.color !== byColor
            ) {
                continue;
            }


            const dr = row - r;
            const dc = col - c;

            const adr = Math.abs(dr);
            const adc = Math.abs(dc);


            /* PAWN */

            if(piece.type === "pawn") {

                const direction =
                    byColor === "white"
                    ? -1
                    : 1;


                if(
                    dr === direction &&
                    adc === 1
                ) {
                    return true;
                }

            }


            /* KNIGHT */

            if(piece.type === "knight") {

                if(
                    (adr === 2 && adc === 1) ||
                    (adr === 1 && adc === 2)
                ) {
                    return true;
                }

            }


            /* KING */

            if(piece.type === "king") {

                if(
                    adr <= 1 &&
                    adc <= 1
                ) {
                    return true;
                }

            }


            /* ROOK / QUEEN */

            if(
                piece.type === "rook" ||
                piece.type === "queen"
            ) {

                if(
                    r === row ||
                    c === col
                ) {

                    if(
                        clearPathOnBoard(
                            board,
                            r,
                            c,
                            row,
                            col
                        )
                    ) {
                        return true;
                    }

                }

            }


            /* BISHOP / QUEEN */

            if(
                piece.type === "bishop" ||
                piece.type === "queen"
            ) {

                if(adr === adc) {

                    if(
                        clearPathOnBoard(
                            board,
                            r,
                            c,
                            row,
                            col
                        )
                    ) {
                        return true;
                    }

                }

            }

        }

    }


    return false;

}


/* =====================================================
   KING CHECK
===================================================== */

function findKing(
    board,
    color
) {

    for(let r = 0; r < 8; r++) {

        for(let c = 0; c < 8; c++) {

            const piece = board[r][c];

            if(
                piece &&
                piece.type === "king" &&
                piece.color === color
            ) {

                return {
                    row:r,
                    col:c
                };

            }

        }

    }


    return null;

}


function isKingInCheckOnBoard(
    board,
    color
) {

    const king = findKing(
        board,
        color
    );


    if(!king) {
        return true;
    }


    return isSquareAttackedOnBoard(
        board,
        king.row,
        king.col,
        opposite(color)
    );

}


function isKingInCheck(color) {

    return isKingInCheckOnBoard(
        boardState,
        color
    );

}


/* =====================================================
   CHECKMATE / STALEMATE
===================================================== */

function hasAnyLegalMove(color) {

    for(let fr = 0; fr < 8; fr++) {

        for(let fc = 0; fc < 8; fc++) {

            const piece = boardState[fr][fc];

            if(
                !piece ||
                piece.color !== color
            ) {
                continue;
            }


            for(let tr = 0; tr < 8; tr++) {

                for(let tc = 0; tc < 8; tc++) {

                    if(
                        isLegalMove(
                            fr,
                            fc,
                            tr,
                            tc
                        )
                    ) {
                        return true;
                    }

                }

            }

        }

    }


    return false;

}


/* =====================================================
   POSITION EVALUATION
===================================================== */

function evaluatePosition() {

    const inCheck =
        isKingInCheck(turn);


    const hasMove =
        hasAnyLegalMove(turn);


    if(!hasMove) {

        stopTimer();

        gameOver = true;


        if(inCheck) {

            const winner =
                opposite(turn);


            document.getElementById("status").textContent =
                winner === "white"
                ? "🏆 SKAKMAT — Kamu menang!"
                : "🏆 SKAKMAT — Opponent menang!";

        }

        else {

            document.getElementById("status").textContent =
                "🤝 REMIS — Stalemate.";

        }


        return;

    }


    if(inCheck) {

        document.getElementById("status").textContent =
            turn === "white"
            ? "⚠️ SKAK! Rajamu sedang diserang."
            : "⚠️ Opponent sedang SKAK!";

    }

    else {

        document.getElementById("status").textContent =
            turn === "white"
            ? "Giliran kamu — pilih bidak."
            : "Giliran Opponent.";

    }

}


/* =====================================================
   BOARD HIGHLIGHT
===================================================== */

function highlightBoard() {

    if(!selected) return;


    const squares =
        document.querySelectorAll(".square");


    squares.forEach(square => {

        const row =
            Number(square.dataset.row);

        const col =
            Number(square.dataset.col);


        if(
            row === selected.row &&
            col === selected.col
        ) {

            square.classList.add("selected");

            return;

        }


        if(
            isLegalMove(
                selected.row,
                selected.col,
                row,
                col
            )
        ) {

            const piece =
                boardState[selected.row][selected.col];


            if(
                piece.type === "king" &&
                Math.abs(col - selected.col) === 2
            ) {

                square.classList.add("castle-move");

            }

            else if(boardState[row][col]) {

                square.classList.add("capture");

            }

            else {

                square.classList.add("move");

            }

        }

    });


    /* SHOW CHECKED KING */

    const checkedColor =
        isKingInCheck("white")
        ? "white"
        : isKingInCheck("black")
        ? "black"
        : null;


    if(checkedColor) {

        const king =
            findKing(
                boardState,
                checkedColor
            );


        if(king) {

            const index =
                king.row * 8 + king.col;


            if(squares[index]) {
                squares[index].classList.add("king-check");
            }

        }

    }

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    stopTimer();


    timerInterval =
        setInterval(() => {

            if(gameOver) {
                stopTimer();
                return;
            }


            if(turn === "white") {

                whiteTime--;

            }

            else {

                blackTime--;

            }


            updateTimers();


            const currentTime =
                turn === "white"
                ? whiteTime
                : blackTime;


            if(currentTime <= 0) {

                currentTimeReachedZero();

            }

        },1000);

}


function stopTimer() {

    if(timerInterval) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


function currentTimeReachedZero() {

    stopTimer();

    gameOver = true;


    if(turn === "white") {

        document.getElementById("status").textContent =
            "⏱️ Waktu habis — Opponent menang!";

    }

    else {

        document.getElementById("status").textContent =
            "⏱️ Waktu habis — Kamu menang!";

    }

}


function formatTime(seconds) {

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;


    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(secs).padStart(2,"0")
    );

}


function updateTimers() {

    const whiteTimer =
        document.getElementById("whiteTimer");

    const blackTimer =
        document.getElementById("blackTimer");


    whiteTimer.textContent =
        formatTime(whiteTime);

    blackTimer.textContent =
        formatTime(blackTime);


    whiteTimer.classList.toggle(
        "active",
        turn === "white" &&
        !gameOver
    );

    blackTimer.classList.toggle(
        "active",
        turn === "black" &&
        !gameOver
    );


    whiteTimer.classList.toggle(
        "low",
        whiteTime <= 30
    );

    blackTimer.classList.toggle(
        "low",
        blackTime <= 30
    );

}


/* =====================================================
   CLONE BOARD
===================================================== */

function cloneBoard(board) {

    return board.map(row =>
        row.map(piece =>
            piece
            ? {
                type: piece.type,
                color: piece.color
            }
            : null
        )
    );

}


/* =====================================================
   OPPOSITE COLOR
===================================================== */

function opposite(color) {

    return color === "white"
        ? "black"
        : "white";

}


/* =====================================================
   NEW GAME
===================================================== */

function newGame() {

    stopTimer();


    boardState =
        createInitialBoard();


    turn = "white";

    selected = null;

    gameOver = false;


    whiteTime = 600;

    blackTime = 600;


    castling = {

        whiteKing: true,
        whiteRookKing: true,
        whiteRookQueen: true,

        blackKing: true,
        blackRookKing: true,
        blackRookQueen: true

    };


    document.getElementById("status").textContent =
        "Giliran kamu — pilih bidak.";


    updateTimers();

    drawBoard();

    startTimer();

}


/* =====================================================
   START GAME
===================================================== */

newGame();
