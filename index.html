<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1711 Chess Arena</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#151515;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:620px;
  padding:14px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;
  background:#242424;
  border:1px solid #3b3b3b;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#55c96a;
}

/* PLAYER */

.player{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#222;
  border:1px solid #363636;
  border-radius:13px;
  padding:9px 11px;
  margin-bottom:9px;
}

.playerInfo{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ddd;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
}

.name{
  font-size:14px;
  font-weight:800;
}

.rating{
  color:#999;
  font-size:11px;
  margin-top:3px;
}

.timer{
  min-width:78px;
  padding:8px 10px;
  text-align:center;
  background:#111;
  border:1px solid #444;
  border-radius:9px;
  font-size:20px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

/* BOARD */

.boardWrap{
  width:100%;
  max-width:590px;
  margin:8px auto;
}

.board{
  width:100%;
  aspect-ratio:1 / 1;

  display:grid;

  grid-template-columns:
    repeat(8,minmax(0,1fr));

  grid-template-rows:
    repeat(8,minmax(0,1fr));

  border:4px solid #292929;

  background:#292929;

  overflow:hidden;
}

.square{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  border:1px solid #686868;

  overflow:hidden;
}

.light{
  background:#f4f4f4;
}

.dark{
  background:#a5a5a5;
}

.selected{
  box-shadow:
    inset 0 0 0 4px #d49a3a;
}

/* PIECE */

.piece{
  display:flex;
  align-items:center;
  justify-content:center;

  width:86%;
  height:92%;

  position:relative;
  z-index:5;
}

.piece svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;

  filter:
    drop-shadow(1px 2px 1px rgba(0,0,0,.40));
}

/* PROPORSI */

.piece.pawn{
  width:58%;
  height:70%;
}

.piece.rook{
  width:70%;
  height:78%;
}

.piece.knight{
  width:84%;
  height:91%;
}

.piece.bishop{
  width:77%;
  height:90%;
}

.piece.queen{
  width:79%;
  height:92%;
}

.piece.king{
  width:81%;
  height:95%;
}

/* tombol */

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

button{
  padding:13px 10px;
  border-radius:11px;
  border:0;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.new{
  background:#e1e1e1;
  color:#111;
}

.find{
  background:#303030;
  color:white;
  border:1px solid #505050;
}

.status{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-top:10px;
}

@media(max-width:430px){

  .app{
    padding:10px;
  }

  .logo{
    font-size:18px;
  }

  .board{
    border-width:3px;
  }

  .piece.pawn{
    width:55%;
    height:67%;
  }

  .piece.rook{
    width:67%;
    height:75%;
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="online">
      <span class="dot"></span>

  </div>

    </div>

    <div class="timer" id="blackTimer">

  <div class="status" id="status">
