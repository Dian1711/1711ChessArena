<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1711 Chess Arena</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#151515;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:14px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.online{
  background:#252525;
  border:1px solid #444;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
}

/* PLAYER */

.player{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:#222;
  border:1px solid #3a3a3a;
  border-radius:12px;

  padding:9px;
  margin-bottom:10px;
}

.playerInfo{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:42px;
  height:42px;

  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#ddd;
  font-size:23px;
}

.name{
  font-size:14px;
  font-weight:bold;
}

.rating{
  margin-top:3px;
  font-size:11px;
  color:#999;
}

.timer{
  background:#111;
  border:1px solid #444;
  border-radius:8px;

  padding:8px 11px;

  font-size:19px;
  font-weight:bold;
}


/* ==================================================
   BOARD
   ================================================== */

.board{
  width:100%;
  aspect-ratio:1 / 1;

  display:grid;

  grid-template-columns:
    repeat(8,1fr);

  grid-template-rows:
    repeat(8,1fr);

  border:4px solid #292929;

  background:#292929;

  margin:8px auto 10px;

  overflow:hidden;
}


/* ==================================================
   SQUARE
   ================================================== */

.square{
  width:100%;
  height:100%;

  display:flex;
  justify-content:center;
  align-items:center;

  border:1px solid #666;

  overflow:hidden;
}

.light{
  background:#f4f4f4;
}

.dark{
  background:#a5a5a5;
}


/* ==================================================
   BIDAK
   ================================================== */

.chess{
  line-height:1;

  font-family:
    "DejaVu Sans",
    "Arial Unicode MS",
    sans-serif;

  font-size:clamp(30px,8.8vw,58px);

  user-select:none;

  text-shadow:
    1px 2px 2px rgba(0,0,0,.45);
}


/* BIDAK COKLAT MUDA */

.whitePiece{
  color:#c89457;

  -webkit-text-stroke:
    1px #70451f;
}


/* BIDAK HITAM */

.blackPiece{
  color:#171717;

  -webkit-text-stroke:
    1px #000;
}


/* TOMBOL */

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

button{
  padding:13px;
  border-radius:10px;
  border:0;

  font-size:14px;
  font-weight:bold;
}

.new{
  background:#e1e1e1;
  color:#111;
}

.find{
  background:#303030;
  color:white;
  border:1px solid #505050;
}

.status{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-top:10px;
}

</style>
</head>
