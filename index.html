<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1711 Chess Arena</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #252a2f 0%, #111416 55%, #080909 100%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 18px 10px;
}

.game {
    width: 100%;
    max-width: 520px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.online {
    font-size: 11px;
    background: #183b24;
    color: #62e28a;
    border: 1px solid #28643b;
    padding: 5px 9px;
    border-radius: 20px;
}

/* PLAYER */

.player {
    background: #191d20;
    border: 1px solid #30363a;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.player-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #30363a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.player-name {
    font-weight: bold;
    font-size: 14px;
}

.rating {
    color: #90979c;
    font-size: 11px;
    margin-top: 3px;
}

.timer {
    background: #0c0e0f;
    border: 1px solid #343a3f;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 17px;
    font-weight: bold;
    min-width: 70px;
    text-align: center;
}

/* BOARD */

.board-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #17191b;
    border: 5px solid #17191b;
    border-radius: 7px;
    box-shadow:
        0 12px 35px rgba(0,0,0,.5),
        0 0 0 1px #35393c;
}

.board {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    overflow: hidden;
    border-radius: 2px;
}

.square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1px solid rgba(50,55,60,.28);
}

.square.light {
    background: #f1f1ed;
}

.square.dark {
    background: #a8adb2;
}

/* SELECTED */

.square.selected {
    box-shadow: inset 0 0 0 4px rgba(255, 193, 7, .9);
}

/* POSSIBLE MOVE */

.square.move::after {
    content: "";
    width: 24%;
    height: 24%;
    border-radius: 50%;
    background: rgba(30, 35, 40, .35);
    position: absolute;
}

/* POSSIBLE CAPTURE */

.square.capture {
    box-shadow: inset 0 0 0 5px rgba(180, 40, 40, .65);
}

/* PIECES */

.piece {
    width: 88%;
    height: 88%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
}

.white-piece {
    filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(345deg)
        brightness(1.05)
        contrast(1.05)
        drop-shadow(0 3px 2px rgba(0,0,0,.30))
        drop-shadow(0 5px 4px rgba(0,0,0,.18));
}

.black-piece {
    filter:
        brightness(.10)
        contrast(1.25)
        drop-shadow(0 2px 1px rgba(255,255,255,.08))
        drop-shadow(0 4px 4px rgba(0,0,0,.35));
}

.pawn {
    width: 72%;
    height: 72%;
}

/* BOTTOM */

.status {
    text-align: center;
    color: #9ca3a7;
    font-size: 12px;
    margin: 12px 0;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.find {
    background: #d8a23c;
    color: #151515;
}

.lobby {
    background: #292e32;
    color: white;
    border: 1px solid #3d4449;
}

button:active {
    transform: scale(.98);
}

/* CHECK */

.in-check {
    box-shadow: inset 0 0 0 5px rgba(220, 50, 50, .85);
}

/* MOBILE */

@media (max-width: 380px) {
    body {
        padding: 12px 7px;
    }

    .logo {
        font-size: 18px;
    }

    .timer {
        font-size: 15px;
        min-width: 64px;
    }

    .player {
        padding: 8px 10px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <div class="logo">♟ 1711 Chess Arena</div>
        <div class="online">● ONLINE</div>
    </div>

    <!-- OPPONENT -->

    <div class="player">

        <div class="player-left">

            <div class="avatar">👤</div>

            <div>
                <div class="player-name">Opponent</div>
                <div class="rating">1200 • Black</div>
            </div>

        </div>

        <div class="timer" id="blackTimer">10:00</div>

    </div>


    <!-- BOARD -->

    <div class="board-wrap">
        <div class="board" id="board"></div>
    </div>


    <!-- YOU -->

    <div class="player" style="margin-top:10px;">

        <div class="player-left">

            <div class="avatar">♟</div>

            <div>
                <div class="player-name">You</div>
                <div class="rating">1200 • Brown</div>
            </div>

        </div>

        <div class="timer" id="whiteTimer">10:00</div>

    </div>


    <div class="status" id="status">
        Giliran kamu — pilih bidak.
    </div>


    <div class="buttons">
        <button class="find" onclick="newGame()">⚔️ Game Baru</button>
        <button class="lobby">🏠 Lobby</button>
    </div>

</div>


<script>

/* =====================================================
   CHESS PIECES
===================================================== */

const pieces = {

    white: {
        king:
        "https://sashite.dev/assets/chess/sides/first/representations/western/king.svg",

        queen:
        "https://sashite.dev/assets/chess/sides/first/representations/western/queen.svg",

        rook:
        "https://sashite.dev/assets/chess/sides/first/representations/western/rook.svg",

        bishop:
        "https://sashite.dev/assets/chess/sides/first/representations/western/bishop.svg",

        knight:
        "https://sashite.dev/assets/chess/sides/first/representations/western/knight.svg",

        pawn:
        "https://sashite.dev/assets/chess/sides/first/representations/western/pawn.svg"
    },

    black: {
        king:
        "https://sashite.dev/assets/chess/sides/second/representations/western/king.svg",

        queen:
        "https://sashite.dev/assets/chess/sides/second/representations/western/queen.svg",

        rook:
        "https://sashite.dev/assets/chess/sides/second/representations/western/rook.svg",

        bishop:
        "https://sashite.dev/assets/chess/sides/second/representations/western/bishop.svg",

        knight:
        "https://sashite.dev/assets/chess/sides/second/representations/western/knight.svg",

        pawn:
        "https://sashite.dev/assets/chess/sides/second/representations/western/pawn.svg"
    }

};


/* =====================================================
   INITIAL BOARD
===================================================== */

let boardState = [

    [
        {type:"rook", color:"black"},
        {type:"knight", color:"black"},
        {type:"bishop", color:"black"},
        {type:"queen", color:"black"},
        {type:"king", color:"black"},
        {type:"bishop", color:"black"},
        {type:"knight", color:"black"},
        {type:"rook", color:"black"}
    ],

    [
        {type:"pawn", color:"black"},
        {type:"pawn", color:"black"},
        {type:"pawn", color:"black"},
        {type:"pawn", color:"black"},
        {type:"pawn", color:"black"},
        {type:"pawn", color:"black"},
        {type:"pawn", color:"black"},
        {type:"pawn", color:"black"}
    ],

    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],

    [
        {type:"pawn", color:"white"},
        {type:"pawn", color:"white"},
        {type:"pawn", color:"white"},
        {type:"pawn", color:"white"},
        {type:"pawn", color:"white"},
        {type:"pawn", color:"white"},
        {type:"pawn", color:"white"},
        {type:"pawn", color:"white"}
    ],

    [
        {type:"rook", color:"white"},
        {type:"knight", color:"white"},
        {type:"bishop", color:"white"},
        {type:"queen", color:"white"},
        {type:"king", color:"white"},
        {type:"bishop", color:"white"},
        {type:"knight", color:"white"},
        {type:"rook", color:"white"}
    ]

];


/* =====================================================
   GAME STATE
===================================================== */

let selected = null;
let turn = "white";
let gameOver = false;


/* =====================================================
   DRAW BOARD
===================================================== */

function drawBoard() {

    const board = document.getElementById("board");

    board.innerHTML = "";

    for(let row = 0; row < 8; row++) {

        for(let col = 0; col < 8; col++) {

            const square = document.createElement("div");

            square.className =
                ((row + col) % 2 === 0)
                ? "square light"
                : "square dark";

            square.dataset.row = row;
            square.dataset.col = col;

            square.addEventListener("click", function() {

                handleSquareClick(row, col);

            });


            const piece = boardState[row][col];


            if(piece) {

                const img = document.createElement("img");

                img.className = "piece";

                if(piece.type === "pawn") {
                    img.classList.add("pawn");
                }

                img.classList.add(
                    piece.color === "white"
                    ? "white-piece"
                    : "black-piece"
                );

                img.src = pieces[piece.color][piece.type];

                square.appendChild(img);

            }

            board.appendChild(square);

        }

    }

    highlightMoves();

}


/* =====================================================
   CLICK SQUARE
===================================================== */

function handleSquareClick(row, col) {

    if(gameOver) return;


    const piece = boardState[row][col];


    /* SELECT PIECE */

    if(!selected) {

        if(!piece) return;

        if(piece.color !== turn) {

            document.getElementById("status").textContent =
                "Sekarang giliran " +
                (turn === "white" ? "kamu." : "Opponent.");

            return;

        }

        selected = {
            row,
            col
        };

        drawBoard();

        return;
    }


    /* CLICK SAME PIECE */

    if(selected.row === row && selected.col === col) {

        selected = null;

        drawBoard();

        return;
    }


    /* SELECT ANOTHER OWN PIECE */

    if(piece && piece.color === turn) {

        selected = {
            row,
            col
        };

        drawBoard();

        return;
    }


    /* MOVE */

    if(isLegalMove(
        selected.row,
        selected.col,
        row,
        col
    )) {

        movePiece(
            selected.row,
            selected.col,
            row,
            col
        );

    }

}


/* =====================================================
   MOVE PIECE
===================================================== */

function movePiece(fromRow, fromCol, toRow, toCol) {

    const movingPiece = boardState[fromRow][fromCol];

    const capturedPiece = boardState[toRow][toCol];


    boardState[toRow][toCol] = movingPiece;

    boardState[fromRow][fromCol] = null;


    /* PAWN PROMOTION */

    if(
        movingPiece.type === "pawn" &&
        (toRow === 0 || toRow === 7)
    ) {

        movingPiece.type = "queen";

    }


    selected = null;


    /* CHECK KING CAPTURE */

    if(
        capturedPiece &&
        capturedPiece.type === "king"
    ) {

        gameOver = true;

        document.getElementById("status").textContent =
            turn === "white"
            ? "🏆 Kamu menang!"
            : "🏆 Opponent menang!";

        drawBoard();

        return;
    }


    turn =
        turn === "white"
        ? "black"
        : "white";


    document.getElementById("status").textContent =
        turn === "white"
        ? "Giliran kamu — pilih bidak."
        : "Giliran Opponent.";


    drawBoard();

}


/* =====================================================
   LEGAL MOVE
===================================================== */

function isLegalMove(fr, fc, tr, tc) {

    const piece = boardState[fr][fc];

    if(!piece) return false;

    const target = boardState[tr][tc];


    if(target && target.color === piece.color) {
        return false;
    }


    const dr = tr - fr;
    const dc = tc - fc;

    const adr = Math.abs(dr);
    const adc = Math.abs(dc);


    /* PAWN */

    if(piece.type === "pawn") {

        const direction =
            piece.color === "white"
            ? -1
            : 1;

        const startRow =
            piece.color === "white"
            ? 6
            : 1;


        /* FORWARD */

        if(dc === 0 && !target) {

            if(dr === direction) {
                return true;
            }

            if(
                fr === startRow &&
                dr === direction * 2 &&
                !boardState[fr + direction][fc]
            ) {
                return true;
            }

        }


        /* CAPTURE */

        if(
            adr === 1 &&
            dr === direction &&
            target &&
            target.color !== piece.color
        ) {
            return true;
        }


        return false;

    }


    /* KNIGHT */

    if(piece.type === "knight") {

        return (
            (adr === 2 && adc === 1) ||
            (adr === 1 && adc === 2)
        );

    }


    /* KING */

    if(piece.type === "king") {

        return adr <= 1 && adc <= 1;

    }


    /* ROOK */

    if(piece.type === "rook") {

        if(fr !== tr && fc !== tc) {
            return false;
        }

        return clearPath(fr, fc, tr, tc);

    }


    /* BISHOP */

    if(piece.type === "bishop") {

        if(adr !== adc) {
            return false;
        }

        return clearPath(fr, fc, tr, tc);

    }


    /* QUEEN */

    if(piece.type === "queen") {

        if(fr === tr || fc === tc) {

            return clearPath(fr, fc, tr, tc);

        }

        if(adr === adc) {

            return clearPath(fr, fc, tr, tc);

        }

        return false;

    }


    return false;

}


/* =====================================================
   PATH CHECK
===================================================== */

function clearPath(fr, fc, tr, tc) {

    const stepR =
        Math.sign(tr - fr);

    const stepC =
        Math.sign(tc - fc);


    let r = fr + stepR;
    let c = fc + stepC;


    while(r !== tr || c !== tc) {

        if(boardState[r][c]) {
            return false;
        }

        r += stepR;
        c += stepC;

    }

    return true;

}


/* =====================================================
   HIGHLIGHT MOVES
===================================================== */

function highlightMoves() {

    if(!selected) return;


    const squares =
        document.querySelectorAll(".square");


    squares.forEach(square => {

        const row =
            Number(square.dataset.row);

        const col =
            Number(square.dataset.col);


        if(
            row === selected.row &&
            col === selected.col
        ) {

            square.classList.add("selected");

            return;
        }


        if(
            isLegalMove(
                selected.row,
                selected.col,
                row,
                col
            )
        ) {

            if(boardState[row][col]) {

                square.classList.add("capture");

            } else {

                square.classList.add("move");

            }

        }

    });

}


/* =====================================================
   NEW GAME
===================================================== */

function newGame() {

    boardState = [

        [
            {type:"rook", color:"black"},
            {type:"knight", color:"black"},
            {type:"bishop", color:"black"},
            {type:"queen", color:"black"},
            {type:"king", color:"black"},
            {type:"bishop", color:"black"},
            {type:"knight", color:"black"},
            {type:"rook", color:"black"}
        ],

        [
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"},
            {type:"pawn", color:"black"}
        ],

        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],

        [
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"},
            {type:"pawn", color:"white"}
        ],

        [
            {type:"rook", color:"white"},
            {type:"knight", color:"white"},
            {type:"bishop", color:"white"},
            {type:"queen", color:"white"},
            {type:"king", color:"white"},
            {type:"bishop", color:"white"},
            {type:"knight", color:"white"},
            {type:"rook", color:"white"}
        ]

    ];


    selected = null;

    turn = "white";

    gameOver = false;

    document.getElementById("status").textContent =
        "Giliran kamu — pilih bidak.";

    drawBoard();

}


/* =====================================================
   START
===================================================== */

drawBoard();

</script>

</body>
</html>
