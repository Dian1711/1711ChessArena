<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>1711 Chess Arena</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#111315;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

button{
    font:inherit;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:12px;
}

/* ================= HEADER ================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    background:#24282c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.logo-title{
    font-size:18px;
    font-weight:800;
}

.online{
    color:#62e58b;
    background:#163522;
    padding:6px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

/* ================= PROFILE ================= */

.profile-card{
    display:flex;
    align-items:center;
    gap:12px;

    background:#1b1e21;
    border:1px solid #30353a;
    border-radius:17px;

    padding:13px;
    margin-bottom:12px;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#353a40;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    font-size:25px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.player-info{
    min-width:0;
}

.player-name{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-username{
    color:#969da4;
    font-size:12px;
    margin-top:3px;
}

.rating{
    margin-top:6px;
    color:#e5c85a;
    font-size:12px;
}

/* ================= PANEL ================= */

.panel{
    background:#1b1e21;
    border:1px solid #30353a;
    border-radius:17px;
    padding:14px;
    margin-bottom:12px;
}

.panel-title{
    font-size:15px;
    font-weight:800;
    margin-bottom:12px;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.menu button{
    min-height:58px;
    border-radius:13px;
    border:1px solid #353a40;
    background:#24282c;
    color:#fff;
    font-weight:700;
}

.menu button:active{
    transform:scale(.98);
}

/* ================= BOT ================= */

.bot-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.bot-btn{
    border:1px solid #353a40;
    background:#24282c;
    color:#fff;
    border-radius:12px;
    padding:14px 5px;
    font-weight:800;
}

.bot-btn small{
    display:block;
    color:#999fa5;
    font-size:10px;
    margin-top:5px;
}

.action{
    width:100%;
    min-height:46px;
    border-radius:11px;
    border:1px solid #353a40;
    background:#24282c;
    color:#fff;
    font-weight:700;
    margin-top:9px;
}

.primary{
    background:#d8a928 !important;
    color:#171717 !important;
    border:0 !important;
}

/* ================= GAME ================= */

#gameScreen{
    display:none;
}

.game-top{
    display:flex;
    align-items:center;
    gap:9px;

    background:#1b1e21;
    border:1px solid #30353a;
    border-radius:14px;

    padding:10px;
    margin-bottom:9px;
}

.mini-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    background:#363b40;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.game-player{
    flex:1;
    min-width:0;
}

.game-name{
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.game-side{
    font-size:11px;
    color:#959ca3;
    margin-top:3px;
}

.timer{
    min-width:76px;
    text-align:center;

    background:#111315;
    border-radius:9px;

    padding:8px 7px;

    font-size:21px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
}

.timer.active{
    color:#e7c34f;
}

/* ================= BOARD ================= */

.board{
    width:100%;
    aspect-ratio:1;

    display:grid;

    grid-template-columns:repeat(8,minmax(0,1fr));
    grid-template-rows:repeat(8,minmax(0,1fr));

    border:3px solid #292d31;
    border-radius:5px;
    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(0,0,0,.45);
}

.square{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    user-select:none;
}

.square.light{
    background:#f1f1ed;
}

.square.dark{
    background:#a8adb2;
}

.square.selected{
    box-shadow:
        inset 0 0 0 4px rgba(231,194,57,.9);
}

.square.legal::after{
    content:"";

    position:absolute;

    width:22%;
    height:22%;

    border-radius:50%;

    background:rgba(25,25,25,.30);
}

.square.capture::after{
    content:"";

    position:absolute;

    inset:5px;

    border-radius:50%;

    border:4px solid rgba(190,65,65,.55);
}

.piece{
    width:82%;
    height:82%;

    object-fit:contain;

    position:relative;
    z-index:2;

    pointer-events:none;
}

.white-piece{
    filter:
        sepia(1)
        saturate(2.2)
        hue-rotate(345deg)
        brightness(1.05)
        contrast(1.05)
        drop-shadow(0 3px 2px rgba(0,0,0,.30))
        drop-shadow(0 5px 4px rgba(0,0,0,.18));
}

.black-piece{
    filter:
        brightness(.10)
        contrast(1.25)
        drop-shadow(0 2px 1px rgba(255,255,255,.08))
        drop-shadow(0 4px 4px rgba(0,0,0,.35));
}

/* ================= STATUS ================= */

.game-status{
    margin-top:9px;

    background:#1b1e21;
    border:1px solid #30353a;
    border-radius:13px;

    padding:11px;

    text-align:center;

    font-size:13px;
}

.game-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;

    margin-top:9px;
}

.game-actions button{
    min-height:45px;

    border-radius:11px;

    border:1px solid #353a40;
    background:#24282c;
    color:#fff;

    font-weight:700;
}

.footer{
    text-align:center;
    color:#7f878e;
    font-size:11px;
    margin-top:12px;
}

/* ================= TOAST ================= */

#toast{
    position:fixed;

    left:50%;
    bottom:24px;

    transform:translateX(-50%) translateY(20px);

    background:#f1f1f1;
    color:#111;

    padding:10px 15px;

    border-radius:20px;

    font-size:13px;
    font-weight:700;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    z-index:9999;

    max-width:90%;
    text-align:center;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     LOBBY
===================================================== -->

<div id="lobbyScreen">

            </div>

    <!-- MAIN MENU -->

<div id="gameScreen">

    <div class="header">

        <div class="logo">

            <div class="logo-icon">

            </div>

            <div class="logo-title">
                1711 Chess Arena
            </div>

        </div>

        <div class="online">

        </div>

    </div>


    <!-- BOT -->

    <div class="game-top">

        <div id="opponentAvatar"

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://mrqyfdqqkghvpdgibgpl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gH_2b-0SQ3FiG_l9t_09Bw_xdNX_KvU";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


let telegramUser = null;
let myUserId = null;
let myRating = 1200;


/* =========================================================
   PIECES
========================================================= */

const PIECES = {

    w:{

        k:"https://sashite.dev/assets/chess/sides/first/representations/western/king.svg",

        q:"https://sashite.dev/assets/chess/sides/first/representations/western/queen.svg",

        r:"https://sashite.dev/assets/chess/sides/first/representations/western/rook.svg",

        b:"https://sashite.dev/assets/chess/sides/first/representations/western/bishop.svg",

        n:"https://sashite.dev/assets/chess/sides/first/representations/western/knight.svg",

        p:"https://sashite.dev/assets/chess/sides/first/representations/western/pawn.svg"

    },

    b:{

        k:"https://sashite.dev/assets/chess/sides/second/representations/western/king.svg",

        q:"https://sashite.dev/assets/chess/sides/second/representations/western/queen.svg",

        r:"https://sashite.dev/assets/chess/sides/second/representations/western/rook.svg",

        b:"https://sashite.dev/assets/chess/sides/second/representations/western/bishop.svg",

        n:"https://sashite.dev/assets/chess/sides/second/representations/western/knight.svg",

        p:"https://sashite.dev/assets/chess/sides/second/representations/western/pawn.svg"

    }

};


/* =========================================================
   GAME VARIABLES
========================================================= */

let game = {

    board:[],

    turn:"w",

    playerColor:"w",

    botLevel:"easy",

    over:false,

    selected:null,

    legal:[],

    botThinking:false

};


let clock = {

    w:600,

    b:600,

    last:Date.now()

};


let clockInterval = null;


/* =========================================================
   TELEGRAM USER
========================================================= */

function loadTelegramUser(){

    telegramUser =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
            ? tg.initDataUnsafe.user
            : null;


    if(!telegramUser){

        document.getElementById(
            "playerName"
        ).textContent =
            "Telegram User";

        document.getElementById(
            "playerUsername"
        ).textContent =
            "Telegram tidak ditemukan";

        return;

    }


    myUserId =
        String(telegramUser.id);


    const fullName =
        [
            telegramUser.first_name,
            telegramUser.last_name
        ]
        .filter(Boolean)
        .join(" ");


    document.getElementById(
        "playerName"
    ).textContent =
        fullName || "Telegram User";


    document.getElementById(
        "playerUsername"
    ).textContent =

        telegramUser.username
            ? "@" + telegramUser.username
            : "Tanpa username";


    if(telegramUser.photo_url){

        document.getElementById(
            "avatar"
        ).innerHTML =

            `<img src="${escapeHtml(
                telegramUser.photo_url
            )}">`;

    }

}


/* =========================================================
   SAVE / LOAD USER
========================================================= */

async function saveUser(){

    if(!telegramUser){

        return;

    }


    const fullName =
        [
            telegramUser.first_name,
            telegramUser.last_name
        ]
        .filter(Boolean)
        .join(" ");


    const {error} =
        await supabaseClient
        .from("users")
        .upsert({

            id:Number(telegramUser.id),

            username:
                telegramUser.username || null,

            name:
                fullName || "Telegram User",

            avatar_url:
                telegramUser.photo_url || null

        },{
            onConflict:"id"
        });


    if(error){

        console.log(
            "Supabase user:",
            error
        );

        document.getElementById(
            "connectionStatus"
        ).textContent =
            "✓ Telegram aktif • Supabase user gagal";

        return;

    }


    const {data} =
        await supabaseClient
        .from("users")
        .select("rating")
        .eq(
            "id",
            Number(telegramUser.id)
        )
        .maybeSingle();


    if(data){

        myRating =
            Number(data.rating || 1200);

        document.getElementById(
            "playerRating"
        ).textContent =
            myRating;

    }


    document.getElementById(
        "connectionStatus"
    ).textContent =
        "✓ Telegram + Supabase terhubung";

}


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

    loadTelegramUser();

    if(telegramUser){

        await saveUser();

    }else{

        document.getElementById(
            "connectionStatus"
        ).textContent =
            "⚠️ Buka melalui Telegram Mini App";

    }

}


init();


/* =========================================================
   LOBBY
========================================================= */

function openBot(){

    document.getElementById(
        "mainMenu"
    ).classList.add("hidden");


    document.getElementById(
        "botPanel"
    ).classList.remove("hidden");

}


function backLobby(){

    document.getElementById(
        "botPanel"
    ).classList.add("hidden");


    document.getElementById(
        "mainMenu"
    ).classList.remove("hidden");

}


function comingSoon(name){

    toast(
        name + " akan kita aktifkan setelah VS Bot stabil."
    );

}


/* =========================================================
   START BOT
========================================================= */

function startBotGame(level){

    game = {

        board:
            initialBoard(),

        turn:"w",

        playerColor:"w",

        botLevel:level,

        over:false,

        selected:null,

        legal:[],

        botThinking:false

    };


    clock.w = 600;
    clock.b = 600;
    clock.last = Date.now();


    const botName =

        level === "easy"
            ? "Bot Easy"
            : level === "normal"
                ? "Bot Normal"
                : "Bot Hard";


    document.getElementById(
        "opponentName"
    ).textContent =
        botName;


    document.getElementById(
        "opponentSide"
    ).textContent =
        "Black • Bot";


    document.getElementById(
        "opponentAvatar"
    ).textContent =
        "🤖";


    document.getElementById(
        "myGameName"
    ).textContent =
        telegramUser
            ? (
                telegramUser.first_name ||
                "You"
            )
            : "You";


    document.getElementById(
        "myGameSide"
    ).textContent =
        "White • ⭐ " + myRating;


    if(
        telegramUser &&
        telegramUser.photo_url
    ){

        document.getElementById(
            "myGameAvatar"
        ).innerHTML =

            `<img
                class="mini-avatar"
                src="${escapeHtml(
                    telegramUser.photo_url
                )}"
            >`;

    }else{

        document.getElementById(
            "myGameAvatar"
        ).textContent =
            "♟";

    }


    document.getElementById(
        "lobbyScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";


    renderBoard();

    updateStatus();

    startClock();

}


function newBotGame(){

    startBotGame(
        game.botLevel || "easy"
    );

}


function backLobbyFromGame(){

    stopClock();


    document.getElementById(
        "gameScreen"
    ).style.display =
        "none";


    document.getElementById(
        "lobbyScreen"
    ).style.display =
        "block";


    backLobby();

}


/* =========================================================
   INITIAL BOARD
========================================================= */

function initialBoard(){

    return [

        [
            "br","bn","bb","bq",
            "bk","bb","bn","br"
        ],

        [
            "bp","bp","bp","bp",
            "bp","bp","bp","bp"
        ],

        [
            null,null,null,null,
            null,null,null,null
        ],

        [
            null,null,null,null,
            null,null,null,null
        ],

        [
            null,null,null,null,
            null,null,null,null
        ],

        [
            null,null,null,null,
            null,null,null,null
        ],

        [
            "wp","wp","wp","wp",
            "wp","wp","wp","wp"
        ],

        [
            "wr","wn","wb","wq",
            "wk","wb","wn","wr"
        ]

    ];

}


/* =========================================================
   BOARD RENDER
========================================================= */

function renderBoard(){

    const boardEl =
        document.getElementById(
            "board"
        );


    boardEl.innerHTML = "";


    for(
        let visualRow=0;
        visualRow<8;
        visualRow++
    ){

        for(
            let visualCol=0;
            visualCol<8;
            visualCol++
        ){

            const r =
                visualRow;

            const c =
                visualCol;


            const square =
                document.createElement(
                    "div"
                );


            square.className =
                "square " +
                (
                    (r+c)%2===0
                        ? "light"
                        : "dark"
                );


            if(
                game.selected &&
                game.selected.r===r &&
                game.selected.c===c
            ){

                square.classList.add(
                    "selected"
                );

            }


            const legal =
                game.legal.some(
                    move =>
                        move.r===r &&
                        move.c===c
                );


            if(legal){

                if(game.board[r][c]){

                    square.classList.add(
                        "capture"
                    );

                }else{

                    square.classList.add(
                        "legal"
                    );

                }

            }


            const piece =
                game.board[r][c];


            if(piece){

                const color =
                    piece[0];

                const type =
                    piece[1];


                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "piece " +
                    (
                        color==="w"
                            ? "white-piece"
                            : "black-piece"
                    );


                img.src =
                    PIECES[color][type];


                img.draggable=false;


                square.appendChild(
                    img
                );

            }


            square.onclick =
                () =>
                    squareClicked(
                        r,
                        c
                    );


            boardEl.appendChild(
                square
            );

        }

    }

}


/* =========================================================
   CLICK SQUARE
========================================================= */

function squareClicked(r,c){

    if(game.over){

        return;

    }


    if(
        game.turn !==
        game.playerColor
    ){

        toast(
            "Sekarang giliran bot."
        );

        return;

    }


    const piece =
        game.board[r][c];


    /* selected piece */

    if(game.selected){

        const isLegal =
            game.legal.some(
                move =>
                    move.r===r &&
                    move.c===c
            );


        if(isLegal){

            playerMove(
                game.selected.r,
                game.selected.c,
                r,
                c
            );

            return;

        }

    }


    /* select own piece */

    if(
        piece &&
        pieceColor(piece) ===
            game.playerColor
    ){

        game.selected = {
            r:r,
            c:c
        };


        game.legal =
            legalMovesFor(
                game.board,
                r,
                c
            );


        renderBoard();

        return;

    }


    game.selected=null;
    game.legal=[];

    renderBoard();

}


/* =========================================================
   MOVE
========================================================= */

function playerMove(fr,fc,tr,tc){

    const legal =
        game.legal.some(
            move =>
                move.r===tr &&
                move.c===tc
        );


    if(!legal){

        return;

    }


    movePiece(
        game.board,
        fr,fc,
        tr,tc
    );


    /* promotion */

    const piece =
        game.board[tr][tc];


    if(
        piece &&
        piece[1]==="p" &&
        (
            tr===0 ||
            tr===7
        )
    ){

        game.board[tr][tc] =
            piece[0] + "q";

    }


    game.selected=null;
    game.legal=[];


    game.turn="b";


    renderBoard();


    const result =
        checkResult(
            game.board,
            "b"
        );


    if(result){

        finishGame(
            result
        );

        return;

    }


    updateStatus();


    setTimeout(
        botMove,
        400
    );

}


/* =========================================================
   MOVE PIECE
========================================================= */

function movePiece(
    board,
    fr,
    fc,
    tr,
    tc
){

    board[tr][tc] =
        board[fr][fc];

    board[fr][fc] =
        null;

}


/* =========================================================
   BASIC HELPERS
========================================================= */

function pieceColor(piece){

    return piece
        ? piece[0]
        : null;

}


function pieceType(piece){

    return piece
        ? piece[1]
        : null;

}


function inside(r,c){

    return (
        r>=0 &&
        r<8 &&
        c>=0 &&
        c<8
    );

}


function cloneBoard(board){

    return board.map(
        row =>
            row.slice()
    );

}


/* =========================================================
   RAW MOVES
========================================================= */

function rawMoves(
    board,
    r,
    c
){

    const piece =
        board[r][c];


    if(!piece){

        return [];

    }


    const color =
        piece[0];

    const type =
        piece[1];


    const moves=[];


    function add(rr,cc){

        if(
            !inside(rr,cc)
        ){

            return false;

        }


        const target =
            board[rr][cc];


        if(!target){

            moves.push({
                r:rr,
                c:cc
            });

            return true;

        }


        if(
            pieceColor(target)
            !==
            color
        ){

            moves.push({
                r:rr,
                c:cc
            });

        }


        return false;

    }


    /* PAWN */

    if(type==="p"){

        const dir =
            color==="w"
                ? -1
                : 1;


        const start =
            color==="w"
                ? 6
                : 1;


        if(
            inside(
                r+dir,
                c
            ) &&
            !board[r+dir][c]
        ){

            moves.push({
                r:r+dir,
                c:c
            });


            if(
                r===start &&
                !board[r+dir*2][c]
            ){

                moves.push({
                    r:r+dir*2,
                    c:c
                });

            }

        }


        for(
            const dc of [-1,1]
        ){

            const rr =
                r+dir;

            const cc =
                c+dc;


            if(
                inside(rr,cc) &&
                board[rr][cc] &&
                pieceColor(
                    board[rr][cc]
                ) !== color
            ){

                moves.push({
                    r:rr,
                    c:cc
                });

            }

        }


        return moves;

    }


    /* KNIGHT */

    if(type==="n"){

        const dirs=[

            [-2,-1],
            [-2,1],

            [-1,-2],
            [-1,2],

            [1,-2],
            [1,2],

            [2,-1],
            [2,1]

        ];


        dirs.forEach(
            d =>
                add(
                    r+d[0],
                    c+d[1]
                )
        );


        return moves;

    }


    /* KING */

    if(type==="k"){

        for(
            let dr=-1;
            dr<=1;
            dr++
        ){

            for(
                let dc=-1;
                dc<=1;
                dc++
            ){

                if(
                    dr ||
                    dc
                ){

                    add(
                        r+dr,
                        c+dc
                    );

                }

            }

        }


        return moves;

    }


    const dirs=[];


    if(
        type==="b" ||
        type==="q"
    ){

        dirs.push(

            [-1,-1],
            [-1,1],

            [1,-1],
            [1,1]

        );

    }


    if(
        type==="r" ||
        type==="q"
    ){

        dirs.push(

            [-1,0],
            [1,0],

            [0,-1],
            [0,1]

        );

    }


    for(
        const d of dirs
    ){

        let rr =
            r+d[0];

        let cc =
            c+d[1];


        while(
            add(rr,cc)
        ){

            rr += d[0];
            cc += d[1];

        }

    }


    return moves;

}


/* =========================================================
   KING / CHECK
========================================================= */

function findKing(
    board,
    color
){

    for(
        let r=0;
        r<8;
        r++
    ){

        for(
            let c=0;
            c<8;
            c++
        ){

            if(
                board[r][c] ===
                color+"k"
            ){

                return {
                    r:r,
                    c:c
                };

            }

        }

    }


    return null;

}


function squareAttacked(
    board,
    r,
    c,
    byColor
){

    for(
        let rr=0;
        rr<8;
        rr++
    ){

        for(
            let cc=0;
            cc<8;
            cc++
        ){

            const piece =
                board[rr][cc];


            if(
                !piece ||
                pieceColor(piece)
                    !== byColor
            ){

                continue;

            }


            const type =
                pieceType(piece);


            /* pawn */

            if(type==="p"){

                const dir =
                    byColor==="w"
                        ? -1
                        : 1;


                if(
                    rr+dir===r &&
                    Math.abs(
                        cc-c
                    )===1
                ){

                    return true;

                }


                continue;

            }


            const moves =
                rawMoves(
                    board,
                    rr,
                    cc
                );


            if(
                moves.some(
                    m =>
                        m.r===r &&
                        m.c===c
                )
            ){

                return true;

            }

        }

    }


    return false;

}


function isCheck(
    board,
    color
){

    const king =
        findKing(
            board,
            color
        );


    if(!king){

        return true;

    }


    const enemy =
        color==="w"
            ? "b"
            : "w";


    return squareAttacked(
        board,
        king.r,
        king.c,
        enemy
    );

}


/* =========================================================
   LEGAL MOVES
========================================================= */

function legalMovesFor(
    board,
    r,
    c
){

    const piece =
        board[r][c];


    if(!piece){

        return [];

    }


    const color =
        pieceColor(piece);


    const raw =
        rawMoves(
            board,
            r,
            c
        );


    return raw.filter(
        move => {

            const copy =
                cloneBoard(
                    board
                );


            movePiece(
                copy,
                r,c,
                move.r,
                move.c
            );


            return !isCheck(
                copy,
                color
            );

        }
    );

}


/* =========================================================
   ALL LEGAL MOVES
========================================================= */

function allLegalMoves(
    board,
    color
){

    const result=[];


    for(
        let r=0;
        r<8;
        r++
    ){

        for(
            let c=0;
            c<8;
            c++
        ){

            const piece =
                board[r][c];


            if(
                piece &&
                pieceColor(piece)
                    === color
            ){

                const moves =
                    legalMovesFor(
                        board,
                        r,
                        c
                    );


                for(
                    const move of moves
                ){

                    result.push({

                        from:{
                            r:r,
                            c:c
                        },

                        to:{
                            r:move.r,
                            c:move.c
                        }

                    });

                }

            }

        }

    }


    return result;

}


/* =========================================================
   GAME RESULT
========================================================= */

function checkResult(
    board,
    color
){

    const moves =
        allLegalMoves(
            board,
            color
        );


    if(
        moves.length===0
    ){

        if(
            isCheck(
                board,
                color
            )
        ){

            return (
                color==="b"
                    ? "player_win"
                    : "player_loss"
            );

        }


        return "draw";

    }


    return null;

}


/* =========================================================
   BOT
========================================================= */

function botMove(){

    if(game.over){

        return;

    }


    if(
        game.turn !== "b"
    ){

        return;

    }


    game.botThinking=true;


    const moves =
        allLegalMoves(
            game.board,
            "b"
        );


    if(!moves.length){

        game.botThinking=false;

        return;

    }


    let selectedMove;


    if(
        game.botLevel==="easy"
    ){

        selectedMove =
            moves[
                Math.floor(
                    Math.random() *
                    moves.length
                )
            ];

    }


    else if(
        game.botLevel==="normal"
    ){

        selectedMove =
            chooseBestMove(
                moves,
                1
            );

    }


    else{

        selectedMove =
            chooseBestMove(
                moves,
                2
            );

    }


    setTimeout(
        () => {

            applyBotMove(
                selectedMove
            );

            game.botThinking=false;

        },
        350
    );

}


/* =========================================================
   BOT APPLY
========================================================= */

function applyBotMove(
    move
){

    if(game.over){

        return;

    }


    movePiece(

        game.board,

        move.from.r,
        move.from.c,

        move.to.r,
        move.to.c

    );


    const piece =
        game.board[
            move.to.r
        ][
            move.to.c
        ];


    if(
        piece &&
        piece[1]==="p" &&
        (
            move.to.r===0 ||
            move.to.r===7
        )
    ){

        game.board[
            move.to.r
        ][
            move.to.c
        ] =
            "bq";

    }


    game.turn="w";


    renderBoard();


    const result =
        checkResult(
            game.board,
            "w"
        );


    if(result){

        finishGame(
            result
        );

        return;

    }


    updateStatus();

}


/* =========================================================
   BOT AI
========================================================= */

function chooseBestMove(
    moves,
    depth
){

    let bestScore =
        -Infinity;


    let bestMoves=[];


    for(
        const move of moves
    ){

        const copy =
            cloneBoard(
                game.board
            );


        movePiece(

            copy,

            move.from.r,
            move.from.c,

            move.to.r,
            move.to.c

        );


        const score =
            minimax(
                copy,
                depth-1,
                false
            );


        if(
            score > bestScore
        ){

            bestScore=score;

            bestMoves=[
                move
            ];

        }

        else if(
            score===bestScore
        ){

            bestMoves.push(
                move
            );

        }

    }


    return bestMoves[
        Math.floor(
            Math.random() *
            bestMoves.length
        )
    ];

}


function minimax(
    board,
    depth,
    maximizing
){

    if(depth<=0){

        return evaluateBoard(
            board
        );

    }


    const color =
        maximizing
            ? "b"
            : "w";


    const moves =
        allLegalMoves(
            board,
            color
        );


    if(!moves.length){

        if(
            isCheck(
                board,
                color
            )
        ){

            return maximizing
                ? -100000
                : 100000;

        }


        return 0;

    }


    if(maximizing){

        let best =
            -Infinity;


        for(
            const move of moves
        ){

            const copy =
                cloneBoard(
                    board
                );


            movePiece(

                copy,

                move.from.r,
                move.from.c,

                move.to.r,
                move.to.c

            );


            best =
                Math.max(

                    best,

                    minimax(
                        copy,
                        depth-1,
                        false
                    )

                );

        }


        return best;

    }


    let best =
        Infinity;


    for(
        const move of moves
    ){

        const copy =
            cloneBoard(
                board
            );


        movePiece(

            copy,

            move.from.r,
            move.from.c,

            move.to.r,
            move.to.c

        );


        best =
            Math.min(

                best,

                minimax(
                    copy,
                    depth-1,
                    true
                )

            );

    }


    return best;

}


/* =========================================================
   BOARD EVALUATION
========================================================= */

function evaluateBoard(
    board
){

    const value={

        p:100,
        n:320,
        b:330,
        r:500,
        q:900,
        k:20000

    };


    let score=0;


    for(
        let r=0;
        r<8;
        r++
    ){

        for(
            let c=0;
            c<8;
            c++
        ){

            const piece =
                board[r][c];


            if(!piece){

                continue;

            }


            const amount =
                value[
                    piece[1]
                ];


            if(
                piece[0]==="b"
            ){

                score += amount;

            }

            else{

                score -= amount;

            }

        }

    }


    return score;

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    updateTimers();


    const status =
        document.getElementById(
            "gameStatus"
        );


    if(game.over){

        return;

    }


    if(
        game.turn ===
        game.playerColor
    ){

        if(
            isCheck(
                game.board,
                game.playerColor
            )
        ){

            status.textContent =
                "⚠️ Kamu sedang CHECK!";

        }

        else{

            status.textContent =
                "♟ Giliran kamu.";

        }

    }

    else{

        status.textContent =
            "🤖 Bot sedang berpikir...";

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(
    result
){

    game.over=true;


    stopClock();


    const status =
        document.getElementById(
            "gameStatus"
        );


    if(
        result==="player_win"
    ){

        status.textContent =
            "🏆 CHECKMATE! Kamu menang!";

    }

    else if(
        result==="player_loss"
    ){

        status.textContent =
            "💀 CHECKMATE! Kamu kalah.";

    }

    else{

        status.textContent =
            "🤝 DRAW!";

    }


    renderBoard();

}


/* =========================================================
   CLOCK
========================================================= */

function startClock(){

    stopClock();


    clock.last =
        Date.now();


    clockInterval =
        setInterval(
            () => {

                if(game.over){

                    return;

                }


                const now =
                    Date.now();


                const diff =
                    (
                        now -
                        clock.last
                    ) / 1000;


                clock.last =
                    now;


                if(
                    game.turn==="w"
                ){

                    clock.w -=
                        diff;

                }

                else{

                    clock.b -=
                        diff;

                }


                clock.w =
                    Math.max(
                        0,
                        clock.w
                    );


                clock.b =
                    Math.max(
                        0,
                        clock.b
                    );


                updateTimers();


                if(
                    clock.w<=0 ||
                    clock.b<=0
                ){

                    timeOut();

                }

            },
            1000
        );

}


function stopClock(){

    if(clockInterval){

        clearInterval(
            clockInterval
        );

        clockInterval=null;

    }

}


function updateTimers(){

    document.getElementById(
        "myTimer"
    ).textContent =
        formatTime(
            clock.w
        );


    document.getElementById(
        "opponentTimer"
    ).textContent =
        formatTime(
            clock.b
        );


    document.getElementById(
        "myTimer"
    ).classList.toggle(
        "active",
        game.turn==="w"
    );


    document.getElementById(
        "opponentTimer"
    ).classList.toggle(
        "active",
        game.turn==="b"
    );

}


function formatTime(
    seconds
){

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );


    const minutes =
        Math.floor(
            seconds/60
        );


    const secs =
        seconds%60;


    return (
        String(minutes)
            .padStart(2,"0")
        +
        ":"
        +
        String(secs)
            .padStart(2,"0")
    );

}


function timeOut(){

    if(game.over){

        return;

    }


    game.over=true;


    stopClock();


    const status =
        document.getElementById(
            "gameStatus"
        );


    if(clock.w<=0){

        status.textContent =
            "⏰ Waktu habis — kamu kalah.";

    }

    else{

        status.textContent =
            "🏆 Waktu bot habis — kamu menang.";

    }

}


/* =========================================================
   TOAST
========================================================= */

function toast(
    message
){

    const el =
        document.getElementById(
            "toast"
        );


    el.textContent =
        message;


    el.classList.add(
        "show"
    );


    clearTimeout(
        window.__toastTimer
    );


    window.__toastTimer =
        setTimeout(
            () => {

                el.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
